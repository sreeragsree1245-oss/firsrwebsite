<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTU CCT308 - 1000+ MCQ Exam Prep</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;color:white;margin-bottom:24px}
header h1{font-size:2.2em;text-shadow:2px 2px 6px rgba(0,0,0,.3)}
header p{opacity:.9;margin-top:4px}
.badge{display:inline-block;background:rgba(255,255,255,.25);padding:4px 14px;border-radius:20px;margin-top:8px;font-size:.85em}
.main-grid{display:grid;grid-template-columns:260px 1fr;gap:20px}
.sidebar{background:white;border-radius:12px;padding:20px;height:fit-content;box-shadow:0 8px 24px rgba(0,0,0,.2);position:sticky;top:20px}
.sidebar h3{color:#667eea;margin-bottom:14px;font-size:1.1em}
.filter-section{margin-bottom:16px}
.filter-section label{display:block;margin-bottom:6px;color:#444;font-weight:600;font-size:.85em}
.filter-section input[type=text],.filter-section select{width:100%;padding:9px;border:1.5px solid #ddd;border-radius:6px;font-size:.88em}
.filter-section input[type=text]:focus{outline:none;border-color:#667eea}
.checkbox-group{max-height:340px;overflow-y:auto}
.checkbox-item{display:flex;align-items:center;margin-bottom:9px;gap:7px}
.checkbox-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#667eea}
.checkbox-item label{margin:0;cursor:pointer;flex:1;font-size:.88em;color:#333}
.checkbox-count{font-size:.75em;color:#aaa}
.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.mode-btn{padding:9px;border:2px solid #667eea;background:white;color:#667eea;border-radius:6px;cursor:pointer;font-weight:700;font-size:.82em;transition:all .25s}
.mode-btn.active{background:#667eea;color:white}
.reset-btn{width:100%;padding:10px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;cursor:pointer;color:#444;font-weight:600;font-size:.88em;transition:all .25s;margin-top:8px}
.reset-btn:hover{background:#e8e8e8}
.content-area{background:white;border-radius:12px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:12px;border-radius:8px;text-align:center}
.stat-card .number{font-size:1.6em;font-weight:800}
.stat-card .label{font-size:.7em;opacity:.9;margin-top:3px}
.search-bar{margin-bottom:16px}
.search-bar input{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:6px;font-size:.95em;transition:all .25s}
.search-bar input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.questions-list{max-height:72vh;overflow-y:auto;padding-right:4px}

/* Question Card */
.question-card{background:#f8f8f8;border:1.5px solid #e8e8e8;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .25s;border-left:4px solid transparent;overflow:hidden}
.question-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);border-left-color:#667eea}
.question-card.expanded{border-left-color:#667eea;background:white;box-shadow:0 6px 20px rgba(102,126,234,.15)}
.question-card.answered-correct{border-left-color:#28a745}
.question-card.answered-wrong{border-left-color:#dc3545}
.q-header{padding:15px 16px;display:flex;align-items:flex-start;gap:10px}
.q-num{color:#667eea;font-weight:700;font-size:.82em;white-space:nowrap;margin-top:2px}
.q-text{color:#222;font-size:.93em;line-height:1.5;flex:1}
.q-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;background:#e8eef9;color:#667eea;padding:3px 9px;border-radius:20px;font-size:.72em;font-weight:600}
.tag.gen{background:#fff3cd;color:#856404}
.q-arrow{color:#aaa;font-size:1em;margin-left:6px;transition:transform .25s;flex-shrink:0;margin-top:2px}
.question-card.expanded .q-arrow{transform:rotate(180deg)}

/* Options area */
.q-body{display:none;padding:0 16px 16px}
.question-card.expanded .q-body{display:block}
.options-grid{display:grid;gap:8px;margin-bottom:12px}
.opt{padding:11px 14px;border:2px solid #e0e0e0;border-radius:7px;cursor:pointer;transition:all .25s;background:white;font-size:.9em;color:#333;display:flex;align-items:flex-start;gap:9px}
.opt:hover{border-color:#667eea;background:#f5f7ff}
.opt-label{font-weight:700;color:#667eea;min-width:18px;flex-shrink:0}
.opt.correct{background:#d4edda;border-color:#28a745;color:#155724}
.opt.correct .opt-label{color:#155724}
.opt.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24}
.opt.wrong .opt-label{color:#721c24}
.opt.dimmed{opacity:.45;cursor:default}
.opt.dimmed:hover{border-color:#e0e0e0;background:white}

/* Explanation box */
.explanation{margin-top:10px;padding:12px 14px;border-radius:7px;font-size:.88em;line-height:1.6;display:none;animation:fadeIn .3s ease}
.explanation.correct-exp{background:#eafaf1;border-left:4px solid #28a745;color:#155724}
.explanation.wrong-exp{background:#fef9e7;border-left:4px solid #e67e22;color:#5d4037}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.exp-title{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}

/* Pagination */
.pagination{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.pagination button{padding:7px 12px;border:1.5px solid #ddd;background:white;cursor:pointer;border-radius:6px;font-size:.85em;transition:all .25s}
.pagination button:hover,.pagination button.active{background:#667eea;color:white;border-color:#667eea}
.empty-state{text-align:center;padding:40px 20px;color:#aaa}
@media(max-width:860px){.main-grid{grid-template-columns:1fr}.sidebar{position:static}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

    <h1>📚 KTU CCT308 Exam Prep Pro</h1>

    </div>
  </div>
</div>

function getExplanation(q, chosenIdx) {
  const exp = explanations[q.id];
  const isCorrect = chosenIdx === q.correct;
  if (exp) {
    return { isCorrect, text: isCorrect ? exp.correct : exp.wrong };
  }
  // Generated questions fallback
  const correctOption = q.options[q.correct];
  if (isCorrect) {
    return { isCorrect:true, text:`"${correctOption}" is the correct answer. This matches the standard definition/rule for this topic.` };
  } else {
    return { isCorrect:false, text:`The correct answer is "${correctOption}". Your selected option doesn't satisfy the required condition for this concept.` };
  }
}

// ─── Filter Logic ──────────────────────────────────────────
function filterQuestions() {
  const s1 = document.getElementById('searchInput').value.toLowerCase();
  const s2 = document.getElementById('mainSearch').value.toLowerCase();
  const term = s1 || s2;

  const checkedSubjects = [...document.querySelectorAll('#subjectFilters input:checked')].map(c => c.value);
  const checkedTypes = [...document.querySelectorAll('.content-area input[type=checkbox]:checked, .sidebar input[type=checkbox][value=Original]:checked, .sidebar input[type=checkbox][value=Generated]:checked')].map(c => c.value);
  const typeChecked = [];
  if (document.getElementById('chk-Original')?.checked) typeChecked.push('Original');
  if (document.getElementById('chk-Generated')?.checked) typeChecked.push('Generated');

  filteredQuestions = allQuestions.filter(q => {
    const matchTerm = !term || q.text.toLowerCase().includes(term) || String(q.id).includes(term);
    const matchSubj = checkedSubjects.includes(q.subject);
    const matchType = typeChecked.length === 0 || typeChecked.includes(q.type);
    return matchTerm && matchSubj && matchType;
  });
  currentPage = 1;
  render();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('mainSearch').value = '';
  document.querySelectorAll('.sidebar input[type=checkbox]').forEach(c => c.checked = true);
  filterQuestions();
}

// ─── Stats ─────────────────────────────────────────────────
function updateStats() {
  document.getElementById('sTotal').textContent = allQuestions.length;
  document.getElementById('sFiltered').textContent = filteredQuestions.length;
  const attempted = Object.keys(userAnswers).length;
  document.getElementById('sAttempted').textContent = attempted;
  const correct = Object.values(userAnswers).filter(v => v.isCorrect).length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sScore').textContent = attempted ? Math.round(correct/attempted*100)+'%' : '0%';
}

// ─── Render ────────────────────────────────────────────────
function render() {
  updateStats();
  const list = document.getElementById('questionsList');
  list.innerHTML = '';

  const start = (currentPage-1)*PER_PAGE;
  const page = filteredQuestions.slice(start, start+PER_PAGE);

  if (!page.length) {
    list.innerHTML = '<div class="empty-state"><div style="font-size:2.5em">🔍</div><p style="margin-top:10px">No questions match your filters</p></div>';
    renderPagination();
    return;
  }

  page.forEach(q => {
    const ans = userAnswers[q.id];
    const isCorrect = ans?.isCorrect;
    const card = document.createElement('div');
    card.className = 'question-card' + (ans ? (isCorrect ? ' answered-correct' : ' answered-wrong') : '');
    card.id = 'card-'+q.id;

    const statusIcon = ans ? (isCorrect ? '✅' : '❌') : '';
    card.innerHTML = `
      <div class="q-header" onclick="toggleCard(${q.id})">
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="q-num">Q${q.id}</span>
            <span style="font-size:.85em">${statusIcon}</span>
          </div>
          <div class="q-text">${q.text}</div>
          <div class="q-tags">
            <span class="tag">${q.subject}</span>
            <span class="tag ${q.type==='Generated'?'gen':''}">${q.type}</span>
            <span class="tag" style="background:#f0f0f0;color:#666">${q.exam}</span>
          </div>
        </div>
        <span class="q-arrow">▼</span>
      </div>
      <div class="q-body" id="body-${q.id}">
        <div class="options-grid" id="opts-${q.id}"></div>
        <div class="explanation" id="exp-${q.id}"></div>
      </div>`;
    list.appendChild(card);

    // Render options
    const optsDiv = document.getElementById('opts-'+q.id);
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.id = `opt-${q.id}-${i}`;
      if (ans) {
        if (i === q.correct) div.classList.add('correct');
        else if (i === ans.chosen) div.classList.add('wrong');
        else div.classList.add('dimmed');
      }
      div.innerHTML = `<span class="opt-label">${labels[i]})</span><span>${opt}</span>`;
      if (!ans) div.onclick = (e) => { e.stopPropagation(); selectAnswer(q, i); };
      optsDiv.appendChild(div);
    });

    // Show explanation if already answered
    if (ans) {
      showExplanation(q, ans.chosen, ans.isCorrect, ans.text);
    }
  });

  renderPagination();
}

function toggleCard(qid) {
  const card = document.getElementById('card-'+qid);
  card.classList.toggle('expanded');
}

function selectAnswer(q, chosen) {
  const result = getExplanation(q, chosen);
  userAnswers[q.id] = { chosen, isCorrect: result.isCorrect, text: result.text };

  // Update card class
  const card = document.getElementById('card-'+q.id);
  card.classList.remove('answered-correct','answered-wrong');
  card.classList.add(result.isCorrect ? 'answered-correct' : 'answered-wrong');

  // Update status icon
  const qnum = card.querySelector('.q-num');
  const sibling = qnum.nextElementSibling;
  sibling.textContent = result.isCorrect ? '✅' : '❌';

  // Color options
  q.options.forEach((_, i) => {
    const opt = document.getElementById(`opt-${q.id}-${i}`);
    opt.classList.remove('correct','wrong','dimmed');
    if (i === q.correct) opt.classList.add('correct');
    else if (i === chosen) opt.classList.add('wrong');
    else opt.classList.add('dimmed');
    opt.onclick = null;
  });

  showExplanation(q, chosen, result.isCorrect, result.text);
  updateStats();
}

function showExplanation(q, chosen, isCorrect, text) {
  const expDiv = document.getElementById('exp-'+q.id);
  if (!expDiv) return;
  expDiv.className = 'explanation ' + (isCorrect ? 'correct-exp' : 'wrong-exp');
  const icon = isCorrect ? '✅' : '💡';
  const title = isCorrect ? 'Why this is correct:' : 'Why this is wrong:';
  expDiv.innerHTML = `<div class="exp-title">${icon} ${title}</div>${text}`;
  expDiv.style.display = 'block';
}

function renderPagination() {
  const div = document.getElementById('pagination');
  div.innerHTML = '';
  const total = Math.ceil(filteredQuestions.length / PER_PAGE);
  if (total <= 1) return;

  const addBtn = (label, page, active=false, disabled=false) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (active) btn.classList.add('active');
    if (disabled) btn.disabled = true;
    btn.onclick = () => { currentPage = page; render(); document.querySelector('.questions-list').scrollTop = 0; };
    div.appendChild(btn);
  };

  addBtn('«', 1, false, currentPage===1);
  addBtn('‹', currentPage-1, false, currentPage===1);

  let start = Math.max(1, currentPage-2), end = Math.min(total, start+4);
  if (end-start < 4) start = Math.max(1, end-4);
  for (let i=start; i<=end; i++) addBtn(i, i, i===currentPage);

  addBtn('›', currentPage+1, false, currentPage===total);
  addBtn('»', total, false, currentPage===total);
}

// ─── Init ──────────────────────────────────────────────────
render();
</script>
</body>
