<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTU CCT308 - Unique MCQ Exam Prep</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;color:white;margin-bottom:24px}
header h1{font-size:2.2em;text-shadow:2px 2px 6px rgba(0,0,0,.3)}
header p{opacity:.9;margin-top:4px}
.badge{display:inline-block;background:rgba(255,255,255,.25);padding:4px 14px;border-radius:20px;margin-top:8px;font-size:.85em}
.main-grid{display:grid;grid-template-columns:260px 1fr;gap:20px}
.sidebar{background:white;border-radius:12px;padding:20px;height:fit-content;box-shadow:0 8px 24px rgba(0,0,0,.2);position:sticky;top:20px}
.sidebar h3{color:#667eea;margin-bottom:14px;font-size:1.1em}
.filter-section{margin-bottom:16px}
.filter-section label{display:block;margin-bottom:6px;color:#444;font-weight:600;font-size:.85em}
.filter-section input[type=text],.filter-section select{width:100%;padding:9px;border:1.5px solid #ddd;border-radius:6px;font-size:.88em}
.filter-section input[type=text]:focus{outline:none;border-color:#667eea}
.checkbox-group{max-height:340px;overflow-y:auto}
.checkbox-item{display:flex;align-items:center;margin-bottom:9px;gap:7px}
.checkbox-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#667eea}
.checkbox-item label{margin:0;cursor:pointer;flex:1;font-size:.88em;color:#333}
.checkbox-count{font-size:.75em;color:#aaa}
.reset-btn{width:100%;padding:10px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;cursor:pointer;color:#444;font-weight:600;font-size:.88em;transition:all .25s;margin-top:8px}
.reset-btn:hover{background:#e8e8e8}
.content-area{background:white;border-radius:12px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:12px;border-radius:8px;text-align:center}
.stat-card .number{font-size:1.6em;font-weight:800}
.stat-card .label{font-size:.7em;opacity:.9;margin-top:3px}
.search-bar{margin-bottom:16px}
.search-bar input{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:6px;font-size:.95em;transition:all .25s}
.search-bar input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.questions-list{max-height:72vh;overflow-y:auto;padding-right:4px}

.question-card{background:#f8f8f8;border:1.5px solid #e8e8e8;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .25s;border-left:4px solid transparent;overflow:hidden}
.question-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);border-left-color:#667eea}
.question-card.expanded{border-left-color:#667eea;background:white;box-shadow:0 6px 20px rgba(102,126,234,.15)}
.question-card.answered-correct{border-left-color:#28a745}
.question-card.answered-wrong{border-left-color:#dc3545}
.q-header{padding:15px 16px;display:flex;align-items:flex-start;gap:10px}
.q-num{color:#667eea;font-weight:700;font-size:.82em;white-space:nowrap;margin-top:2px}
.q-text{color:#222;font-size:.93em;line-height:1.5;flex:1}
.q-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;background:#e8eef9;color:#667eea;padding:3px 9px;border-radius:20px;font-size:.72em;font-weight:600}
.tag.gen{background:#fff3cd;color:#856404}
.q-arrow{color:#aaa;font-size:1em;margin-left:6px;transition:transform .25s;flex-shrink:0;margin-top:2px}
.question-card.expanded .q-arrow{transform:rotate(180deg)}

.q-body{display:none;padding:0 16px 16px}
.question-card.expanded .q-body{display:block}
.options-grid{display:grid;gap:8px;margin-bottom:12px}
.opt{padding:11px 14px;border:2px solid #e0e0e0;border-radius:7px;cursor:pointer;transition:all .25s;background:white;font-size:.9em;color:#333;display:flex;align-items:flex-start;gap:9px}
.opt:hover{border-color:#667eea;background:#f5f7ff}
.opt-label{font-weight:700;color:#667eea;min-width:18px;flex-shrink:0}
.opt.correct{background:#d4edda;border-color:#28a745;color:#155724}
.opt.correct .opt-label{color:#155724}
.opt.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24}
.opt.wrong .opt-label{color:#721c24}
.opt.dimmed{opacity:.45;cursor:default}
.opt.dimmed:hover{border-color:#e0e0e0;background:white}

.explanation{margin-top:10px;padding:12px 14px;border-radius:7px;font-size:.88em;line-height:1.6;display:none;animation:fadeIn .3s ease}
.explanation.correct-exp{background:#eafaf1;border-left:4px solid #28a745;color:#155724}
.explanation.wrong-exp{background:#fef9e7;border-left:4px solid #e67e22;color:#5d4037}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.exp-title{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}

.pagination{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.pagination button{padding:7px 12px;border:1.5px solid #ddd;background:white;cursor:pointer;border-radius:6px;font-size:.85em;transition:all .25s}
.pagination button:hover,.pagination button.active{background:#667eea;color:white;border-color:#667eea}
.empty-state{text-align:center;padding:40px 20px;color:#aaa}
@media(max-width:860px){.main-grid{grid-template-columns:1fr}.sidebar{position:static}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.stat-card{padding:14px 8px}.pagination button{padding:10px 14px;min-width:44px;min-height:44px}.opt{padding:14px;min-height:44px}.checkbox-item input[type=checkbox]{width:20px;height:20px;min-width:20px}.reset-btn{padding:14px;min-height:44px}.search-bar input{padding:14px}}

/* Dark Mode */
body.dark-mode{background:linear-gradient(135deg,#1a1a2e,#16213e)!important}
body.dark-mode .sidebar,body.dark-mode .content-area{background:#1e1e2e;color:#e0e0e0;box-shadow:0 8px 24px rgba(0,0,0,.5)}
body.dark-mode .sidebar h3{color:#a78bfa}
body.dark-mode .filter-section label{color:#ccc}
body.dark-mode .filter-section input[type=text],body.dark-mode .filter-section select{background:#2d2d3f;border-color:#444;color:#e0e0e0}
body.dark-mode .filter-section input:focus{border-color:#a78bfa}
body.dark-mode .reset-btn{background:#2d2d3f;border-color:#444;color:#ccc}
body.dark-mode .reset-btn:hover{background:#3d3d5f}
body.dark-mode .question-card{background:#252535;border-color:#3d3d5f}
body.dark-mode .question-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.4);border-left-color:#a78bfa}
body.dark-mode .question-card.expanded{background:#2d2d45;border-left-color:#a78bfa;box-shadow:0 6px 20px rgba(167,139,250,.15)}
body.dark-mode .q-text{color:#ddd}
body.dark-mode .q-num{color:#a78bfa}
body.dark-mode .tag{background:#2d2d5f;color:#a78bfa}
body.dark-mode .tag.gen{background:#3d2d1f;color:#f59e0b}
body.dark-mode .opt{background:#2d2d45;border-color:#3d3d5f;color:#ddd}
body.dark-mode .opt:hover{border-color:#a78bfa;background:#3d3d5f}
body.dark-mode .opt.dimmed{opacity:.3}
body.dark-mode .opt.dimmed:hover{background:#2d2d45;border-color:#3d3d5f}
body.dark-mode .search-bar input{background:#2d2d3f;border-color:#444;color:#e0e0e0}
body.dark-mode .search-bar input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.15)}
body.dark-mode .pagination button{background:#2d2d3f;border-color:#444;color:#ccc}
body.dark-mode .pagination button:hover,body.dark-mode .pagination button.active{background:#667eea;color:white;border-color:#667eea}
body.dark-mode .checkbox-item label{color:#ccc}
body.dark-mode .checkbox-count{color:#777}
body.dark-mode .stat-card{background:linear-gradient(135deg,#4c1d95,#1e3a5f)}
body.dark-mode header{color:#e0e0e0}

/* Dark mode toggle button */
.dark-toggle{position:fixed;top:16px;right:16px;z-index:9999;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);color:white;border-radius:50px;padding:8px 16px;cursor:pointer;font-size:.85em;font-weight:600;backdrop-filter:blur(8px);transition:all .3s;display:flex;align-items:center;gap:6px}
.dark-toggle:hover{background:rgba(255,255,255,.35);transform:scale(1.05)}
body.dark-mode .dark-toggle{background:rgba(30,30,60,.6);border-color:rgba(167,139,250,.5);color:#a78bfa}

/* Analytics modal */
.analytics-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:.88em;width:100%;margin-bottom:8px;transition:all .25s}
.analytics-btn:hover{opacity:.9;transform:translateY(-1px)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:white;border-radius:16px;padding:28px;max-width:720px;width:95%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
body.dark-mode .modal-box{background:#1e1e2e;color:#e0e0e0}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{color:#667eea;font-size:1.3em}
body.dark-mode .modal-header h2{color:#a78bfa}
.modal-close{background:none;border:none;font-size:1.5em;cursor:pointer;color:#aaa;padding:4px 8px;border-radius:6px;transition:all .2s}
.modal-close:hover{background:#f0f0f0;color:#333}
body.dark-mode .modal-close:hover{background:#2d2d45;color:#e0e0e0}
.chart-section{margin-bottom:24px}
.chart-section h3{font-size:1em;color:#555;margin-bottom:12px;font-weight:700}
body.dark-mode .chart-section h3{color:#aaa}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:.82em}
.bar-label{width:160px;flex-shrink:0;color:#555;font-weight:600;text-align:right}
body.dark-mode .bar-label{color:#aaa}
.bar-track{flex:1;background:#f0f0f0;border-radius:20px;height:22px;overflow:hidden;position:relative}
body.dark-mode .bar-track{background:#2d2d45}
.bar-fill{height:100%;border-radius:20px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.78em;font-weight:700;color:white}
.bar-fill.correct{background:linear-gradient(90deg,#28a745,#5cb85c)}
.bar-fill.wrong{background:linear-gradient(90deg,#dc3545,#e57373)}
.bar-fill.subject{background:linear-gradient(90deg,#667eea,#764ba2)}
.bar-fill.time{background:linear-gradient(90deg,#fd7e14,#ffc107)}
.donut-row{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
.donut-wrap{position:relative;width:120px;height:120px}
.donut-wrap svg{width:120px;height:120px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-pct{font-size:1.3em;font-weight:800;color:#667eea}
body.dark-mode .donut-pct{color:#a78bfa}
.donut-lbl{font-size:.65em;color:#888;margin-top:2px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:500px){.analytics-grid{grid-template-columns:1fr}.bar-label{width:100px}}
.ana-stat{background:#f8f8f8;border-radius:10px;padding:14px;text-align:center}
body.dark-mode .ana-stat{background:#252535}
.ana-stat .big{font-size:1.8em;font-weight:800;color:#667eea}
body.dark-mode .ana-stat .big{color:#a78bfa}
.ana-stat .sm{font-size:.75em;color:#888;margin-top:4px}
.no-data{text-align:center;padding:30px;color:#aaa;font-size:.9em}

/* Difficulty rating */
.diff-rating{margin-top:10px;padding:10px 0 4px;display:flex;align-items:center;gap:8px;font-size:.82em;color:#888;border-top:1px solid #eee}
body.dark-mode .diff-rating{border-color:#3d3d5f;color:#777}
.diff-rating span{font-weight:600}
.diff-stars{display:flex;gap:4px}
.diff-star{cursor:pointer;font-size:1.1em;opacity:.35;transition:all .2s}
.diff-star.active{opacity:1}
.diff-star:hover,.diff-star:hover~.diff-star{opacity:.6}
.diff-labels{font-size:.72em;color:#aaa;margin-left:4px}
</style>
</head>
<body>
<button class="dark-toggle" onclick="toggleDark()">🌙 <span id="darkLabel">Dark</span></button>
<div id="analyticsModal" class="modal-overlay" onclick="if(event.target===this)closeAnalytics()">
  <div class="modal-box">
    <div class="modal-header">
      <h2>📊 Analytics Dashboard</h2>
      <button class="modal-close" onclick="closeAnalytics()">✕</button>
    </div>
    <div id="analyticsContent"></div>
  </div>
</div>
<div class="container">
  <header>
    <h1>📚 KTU CCT308 Exam Prep Pro</h1>
    <p>Comprehensive Course Work · 200+ Interactive MCQ Practice</p>
    <span class="badge">✨ Original + Generated Practice Questions</span>
  </header>

  <div class="main-grid">
    <div class="sidebar">
      <h3>🎛 Study Tools</h3>

      <div class="filter-section">
        <label>📋 Subject</label>
        <div class="checkbox-group" id="subjectFilters"></div>
      </div>
      <div class="filter-section">
        <label>📁 Type</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="chk-Original" value="Original" checked onchange="filterQuestions()">
            <label for="chk-Original">Original Papers</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="chk-Generated" value="Generated" checked onchange="filterQuestions()">
            <label for="chk-Generated">Generated Practice</label>
          </div>
        </div>
      </div>
      <button class="analytics-btn" onclick="openAnalytics()">📊 Analytics Dashboard</button>
      <button class="reset-btn" onclick="resetFilters()">🔄 Reset Filters</button>
      <button id="resetAnswersBtn" class="reset-btn" style="margin-top:6px;background:#fff0f0;border-color:#ffcccc;color:#c0392b;font-weight:700;" onclick="resetAllAnswers()">🗑️ Reset All Answers</button>
    </div>

    <div class="content-area">
      <div class="stats">
        <div class="stat-card"><div class="number" id="sTotal">0</div><div class="label">Total Qs</div></div>
        <div class="stat-card"><div class="number" id="sFiltered">0</div><div class="label">Filtered</div></div>
        <div class="stat-card"><div class="number" id="sAttempted">0</div><div class="label">Attempted</div></div>
        <div class="stat-card"><div class="number" id="sCorrect">0</div><div class="label">Correct</div></div>
        <div class="stat-card"><div class="number" id="sScore">0%</div><div class="label">Score</div></div>
      </div>
      <div class="search-bar">
        <input type="text" id="mainSearch" placeholder="🔎 Quick search questions..." oninput="filterQuestions()">
      </div>
      <div class="questions-list" id="questionsList"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script>

const labels = ['a','b','c','d'];
let allQuestions = [], filteredQuestions = [], userAnswers = {}, currentPage = 1;
const PER_PAGE = 12;

// ─── Explanations map ──────────────────────────────────────
const explanations = {
  // Data Structures
  1: {correct:"A Stack is used for infix-to-postfix conversion because it follows LIFO order to hold operators while scanning the expression left to right.", wrong:"Trees store hierarchical data; Queues are FIFO and cannot handle operator precedence needed for this conversion."},
  2: {correct:"The number of distinct BSTs with n keys is the nth Catalan number: C(n) = C(2n,n)/(n+1). For n=5: C(5) = C(10,5)/6 = 252/6 = 42.", wrong:"BST count follows the Catalan number formula C(n). C(5)=42. Options like 132 = C(6), 14 = C(4) — these are Catalan numbers for different n values, not n=5."},
  3: {correct:"Stack's LIFO nature is perfect for matching parentheses — push opening brackets, pop and compare on closing ones.", wrong:"Queue, Tree, and List don't support the LIFO mechanism needed to track nested bracket pairs."},
  4: {correct:"B+ tree height h=3 means 3 levels of index. With order 100, maximum nodes accessed = h = 3 (root→internal→leaf).", wrong:"With h=3 and order 100, you traverse root, one internal node, and leaf = 3 nodes maximum."},
  5: {correct:"Merge Sort has O(n log n) worst case even on linked lists because it splits and merges without needing random access, unlike Quick Sort or Heap Sort.", wrong:"Quick Sort has O(n²) worst case on linked lists; Heap Sort needs random access; Insertion Sort is O(n²) on average."},
  6: {correct:"All three are classic Stack applications — function call management uses the call stack, stock span uses a monotonic stack, and expression evaluation uses an operator stack.", wrong:"All options A, B, and C are valid stack applications, making 'All of the above' correct."},
  7: {correct:"Average BST depth is O(log n) for random insertions because each element roughly halves the remaining search space.", wrong:"O(n) is worst case (skewed tree), O(√n) and O(n log n) don't represent BST depth."},
  8: {correct:"In C/C++, arrays are declared as: datatype arrayName[size]; — so int ar[20]; is correct syntax.", wrong:"Other options miss the data type or use wrong brackets/keywords not recognized by C compilers."},
  9: {correct:"A complete graph has every vertex connected to every other. Edges = n*(n-1)/2 because each of n vertices connects to n-1 others, divided by 2 to avoid counting each edge twice.", wrong:"n*(n+1)/2 overcounts; just n gives too few; the formula n*(n-1)/2 is the standard for complete graphs."},
  10: {correct:"Post-order traversal visits Left→Right→Root. So the result 10,30,25,60,90,75,50 confirms post-order (root 50 comes last).", wrong:"Pre-order visits Root first; In-order visits Left-Root-Right; Level-order visits level by level."},
  11: {correct:"Merge Sort guarantees O(n log n) in worst case because it always splits the array into two equal halves regardless of input.", wrong:"Quick Sort degrades to O(n²) in worst case; Bubble and Selection Sort are always O(n²)."},
  12: {correct:"When two keys hash to the same bucket, it's called a Collision. This is handled by chaining or open addressing.", wrong:"Diffusion, Replication, and Duplication are unrelated data structure terms."},
  13: {correct:"B-tree of order 5, height 3: Max nodes = (5^(3+1)−1)/(5−1) = (625−1)/4 = 156 nodes. Each node holds at most (order−1) = 4 keys. Max keys = 156 × 4 = 624.", wrong:"250 and 550 use incorrect formulas. 621 is close but wrong — the correct calculation is 156 max nodes × 4 keys each = 624."},
  15: {correct:"Arrays store elements in contiguous memory with sequential indexing — the definition of a linear data structure.", wrong:"AVL Tree, Binary Tree, and Graph are non-linear (hierarchical/network) structures."},
  16: {correct:"Underflow occurs when you try to remove from an empty stack/queue — there's nothing to remove.", wrong:"Overflow happens when adding to a full structure; Syntax Error is a compile-time issue."},
  17: {correct:"Two queues are needed: one acts as the main stack, another as a helper for push/pop simulation.", wrong:"Using 1 queue can work with rotation but is less efficient; 3 or 4 queues are unnecessarily wasteful."},
  18: {correct:"By definition, a binary tree node can have at most 2 children (left and right child).", wrong:"1 is a linked list; 3,4 would make it a ternary/n-ary tree, not binary."},
  20: {correct:"Data transfer between asynchronous processes is the job of a Queue (FIFO buffer), not a Stack.", wrong:"Parenthesis balancing, local variable tracking, and syntax analysis all inherently use stack (LIFO) behavior."},

  // OS
  21: {correct:"Process size = 103KB. Pages used = ceil(103/4) = 26 pages = 104KB allocated. Internal fragmentation = 104 - 103 = 1KB.", wrong:"Internal fragmentation = (page_size - leftover). 103 mod 4 = 3, so leftover in last page = 4-3 = 1KB."},
  22: {correct:"Round Robin gives each process equal CPU time slices, preventing any single process from monopolizing the CPU — this improves interactive response time.", wrong:"FCFS is non-preemptive and may cause long waits; SPN and Priority don't guarantee equal turns."},
  23: {correct:"Banker's Algorithm is a non-preemptive deadlock avoidance strategy — it checks safe states before granting resources.", wrong:"Preemptive means resources can be taken away; Banker's works by refusing unsafe allocations, not by preemption."},
  24: {correct:"System calls are the interface between user programs and OS services — they let programs request OS operations like file I/O.", wrong:"Libraries wrap system calls; Assembly is low-level but not the interface; API is a higher-level concept."},
  25: {correct:"After I/O completes, the process moves to Ready queue, waiting to be scheduled back onto the CPU.", wrong:"It doesn't go back to Running (scheduler decides that); Terminated means it finished; Suspended is different."},
  29: {correct:"Mutual exclusion means only one process can use a resource at a time — this is the condition where processes claim exclusive control.", wrong:"Hold and wait means holding one while waiting for another; No preemption means resources can't be forcibly taken."},
  30: {correct:"Critical section is a code segment that accesses shared resources (shared variables, files, hardware), and must not be executed by more than one process simultaneously.", wrong:"It's defined by shared resource access, not time constraints, P/V operations (those are semaphore ops), or deadlock avoidance."},
  31: {correct:"If all philosophers pick the left fork simultaneously, no one can get the right fork — circular wait → deadlock.", wrong:"Other arrangements allow at least one philosopher to eat and release forks, breaking the deadlock cycle."},
  32: {correct:"Segmentation divides memory into variable-sized segments based on logical program structure (code, stack, data).", wrong:"Paging uses fixed-size frames; Swapping moves entire processes; Fragmentation is a problem, not a technique."},
  35: {correct:"The dirty bit (modified bit) is set when a page has been written to after being loaded into memory, indicating it must be written back to disk before replacement.", wrong:"Page fault is a separate event; dirty bit doesn't indicate corruption or illegal access."},
  37: {correct:"Banker's Algorithm is a deadlock avoidance algorithm — it simulates resource allocation to check if the system remains in a safe state.", wrong:"Deadlock prevention modifies conditions; recovery detects and resolves; avoidance proactively checks safety."},
  40: {correct:"In Dining Philosophers with n philosophers, at most n-1 can eat simultaneously — this prevents circular wait (deadlock).", wrong:"n would allow all to hold one fork each (deadlock); 1 is too conservative; the safe max is n-1."},
  44: {correct:"Mutual exclusion ensures that if one process is in the critical section, no other can enter — preventing concurrent access to shared resources.", wrong:"Bounded waiting limits how long a process waits; the condition described (no others in CS) is exactly mutual exclusion."},
  45: {correct:"All four conditions must hold simultaneously for deadlock: Mutual Exclusion, Hold & Wait, No Preemption, and Circular Wait.", wrong:"Any single condition alone doesn't cause deadlock — all four must be present together."},
  49: {correct:"Optimal Page Replacement (Bélády's algorithm) replaces the page that won't be used for the longest future time — theoretically best but not implementable in practice.", wrong:"LRU approximates optimal but isn't perfect; FIFO can suffer Bélády's anomaly; Counting is heuristic."},

  // Database
  52: {correct:"Two-Phase Locking (2PL) ensures conflict serializability by having a growing phase (acquire locks) and shrinking phase (release locks).", wrong:"Timestamp and graph-based protocols enforce serialization differently but 2PL is the standard for conflict serializability."},

  // Cryptography
  111: {correct:"Cryptography supports digital signatures (non-repudiation), authentication (identity verification), and key generation — all three are valid applications.", wrong:"All options are valid uses of cryptographic algorithms and protocols, making 'All of the above' correct."},
  112: {correct:"Non-repudiation means the sender cannot deny sending a message — digital signatures provide this guarantee by proving origin.", wrong:"Privacy = confidentiality; Authentication verifies identity; Reliability isn't a cryptographic property."},
  113: {correct:"AES (Advanced Encryption Standard) is a symmetric algorithm — same key for encryption and decryption, fast and widely used.", wrong:"RSA and ECC are asymmetric (public/private key pair); DSA is for signatures only."},
  115: {correct:"ECC provides equivalent security to RSA with much smaller keys (256-bit ECC ≈ 3072-bit RSA), saving bandwidth and computation.", wrong:"ECC isn't necessarily faster in all implementations; its key advantage is smaller key size for same security level."},
  116: {correct:"SSL/TLS (Secure Sockets Layer/Transport Layer Security) provides encrypted, authenticated communication over networks.", wrong:"FTP, HTTP, and SMTP transmit data in plaintext — they're not secure without TLS wrapping (FTPS, HTTPS, SMTPS)."},
  118: {correct:"A one-way function is easy to compute forward (y = f(x)) but computationally infeasible to invert (find x given y) — foundation of public-key cryptography.", wrong:"One-way means it can't be practically reversed; it's not symmetric and the private key doesn't make reversal public."},
  119: {correct:"Cryptanalysis is the study of breaking cryptographic systems by exploiting weaknesses in algorithms, protocols, or implementations.", wrong:"Phishing targets humans (social engineering); MITM intercepts communications; DoS disrupts availability."},
  120: {correct:"AES supports three key sizes: 128-bit (10 rounds), 192-bit (12 rounds), and 256-bit (14 rounds) — all are valid AES variants.", wrong:"Asking which one is correct when all three are valid standards makes 'All of the above' correct."},
  122: {correct:"ECB (Electronic Codebook) is a block cipher mode of operation for symmetric algorithms, not an asymmetric algorithm. DSA, DH, and RSA are all asymmetric.", wrong:"DSA, DH, and RSA all use public/private key pairs. ECB is a symmetric cipher mode, making it the odd one out."},
  125: {correct:"SHA-512 processes data in 1024-bit blocks and produces a 512-bit hash output. The block size is 1024 bits.", wrong:"512 bits is the output (digest) size, not the block size; SHA-512's internal block processing uses 1024-bit chunks."},
  126: {correct:"SHA-1 (Secure Hash Algorithm) creates a fixed-size message digest from variable-length input, used for integrity verification.", wrong:"RSA is for encryption/signing; DES is a symmetric cipher — neither is primarily a hashing algorithm."},
  128: {correct:"AES is considered stronger than Triple DES — it has a larger effective key space, faster performance, and no known practical attacks.", wrong:"DES is broken; Double DES is vulnerable to meet-in-the-middle attack; Triple DES is strong but slower than AES."},
  129: {correct:"RSA is an asymmetric algorithm — it uses a mathematically related public/private key pair based on integer factorization hardness.", wrong:"Symmetric algorithms use the same key; RSA is fundamentally defined by its public/private key structure."},
  131: {correct:"AES (Advanced Encryption Standard) is a symmetric key algorithm — it uses the same key for both encryption and decryption, making it fast and ideal for bulk data.", wrong:"RSA, Diffie-Hellman, and ECC are all asymmetric algorithms that use mathematically related public/private key pairs — only AES is symmetric here."},
  134: {correct:"Hash functions ensure integrity — if even one bit changes, the hash output is completely different, proving the message was altered.", wrong:"Hash doesn't prevent replacement entirely (hash must also be protected), but the primary guarantee is detecting changes."},
  136: {correct:"Cryptography's core security goals are Confidentiality (privacy), Integrity (no tampering), and Authenticity (proving identity) — all three together.", wrong:"Each option alone is a goal, but together they represent the complete CIA+ triad of cryptographic security objectives."},
  137: {correct:"ECB (Electronic Codebook) mode encrypts each block independently — suitable for short data like single blocks, though insecure for long data with patterns.", wrong:"CBC, CFB, OFB use chaining/feedback making them better for longer data but with added initialization complexity."},
  140: {correct:"AES (Advanced Encryption Standard) is a symmetric algorithm — uses the same key for both encryption and decryption.", wrong:"RSA and ECC are asymmetric; DSA is used only for signing — none use the same key for encryption and decryption."},
  141: {correct:"Inserting at the beginning of a singly linked list requires just updating the head pointer — no traversal needed, so it's O(1).", wrong:"O(n) applies to insertion at a specific position or end; O(log n) is for binary search; O(n²) is for nested iterations."},
  142: {correct:"In a circular queue, full condition is rear == (front+1) % n to distinguish full from empty (where front == rear).", wrong:"front == rear means empty; rear == n-1 is linear queue logic; the modulo formula is essential for circular wraparound."},
  143: {correct:"In-order traversal (Left → Root → Right) visits nodes in ascending sorted order for a BST, because left subtree has smaller values.", wrong:"Pre-order (Root→L→R) and Post-order (L→R→Root) don't produce sorted output; Level-order visits breadth-first."},
  144: {correct:"Heapify (specifically 'sift-down') is the process of removing the root and restoring the max-heap property by swapping downward.", wrong:"Deletion is the general term; Sifting is informal; Extraction may describe the removal but Heapify is the standard term for the restoration process."},
  145: {correct:"AVL tree maintains the balance factor (height difference between left and right subtrees) to be at most 1 for every node, ensuring O(log n) operations.", wrong:"0 would mean perfectly balanced (too strict); 2 or 3 allows more imbalance — AVL's guarantee is strictly ≤ 1."},
  146: {correct:"Belady's anomaly occurs in FIFO page replacement — counterintuitively, adding more page frames can increase page faults.", wrong:"Optimal is always the best (no anomaly); LRU is immune to Belady's anomaly; LFU doesn't exhibit it either."},
  147: {correct:"Context switching is performed by the OS kernel — it saves the current process state (PCB) and loads the next process's state.", wrong:"Applications don't manage CPU state; compilers generate code; hardware alone doesn't decide which process runs next."},
  148: {correct:"FCFS (First-Come First-Served) is non-preemptive — once a process starts, it runs to completion without interruption.", wrong:"Round Robin is preemptive (time-quantum); SRTF is preemptive (shortest remaining time); Multilevel Queue can be preemptive."},
  149: {correct:"A binary semaphore only takes values 0 or 1, providing mutual exclusion like a lock.", wrong:"Counting semaphore can take any non-negative value; Mutex has ownership semantics; Monitor is a higher-level construct."},
  150: {correct:"The critical section is the part of a process that accesses shared resources and must not be executed by more than one process simultaneously.", wrong:"Shared memory is accessible to multiple processes; Heap is per-process dynamic memory; Cache is hardware memory."},
  151: {correct:"DISTINCT eliminates duplicate rows from the result set — SELECT DISTINCT col FROM table returns only unique values.", wrong:"UNIQUE is a constraint; GROUP BY groups rows; HAVING filters groups — DISTINCT is the keyword for removing duplicates."},
  152: {correct:"A weak entity depends on a strong entity for its existence and has no key attribute of its own — it uses a partial key combined with the owner's primary key.", wrong:"Strong entity has its own primary key; Derived entity is computed; Multi-valued entity has multiple values for one attribute."},
  153: {correct:"2NF removes partial dependencies — every non-prime attribute must depend on the whole primary key, not just part of it.", wrong:"1NF ensures atomic values; 3NF removes transitive dependencies; BCNF is stricter. Partial dependency removal is exclusively 2NF."},
  154: {correct:"GRANT is the SQL DCL command used to give specific privileges (SELECT, INSERT, UPDATE, etc.) to users or roles.", wrong:"ALLOW, PERMIT, and ASSIGN are not valid SQL commands — GRANT and REVOKE are the only standard privilege control commands."},
  155: {correct:"Referential integrity requires that every foreign key value must match an existing primary key value in the referenced table.", wrong:"Uniqueness applies to primary keys; NULL is sometimes allowed for FK; being a primary key applies to the referenced side."},
  156: {correct:"DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses, subnet masks, gateways, and DNS server info to hosts.", wrong:"DNS resolves domain names; ARP resolves IPs to MACs; ICMP handles error messages — none assign IP addresses automatically."},
  157: {correct:"The IPv4 Total Length field is 16 bits, giving a maximum datagram size of 2^16 − 1 = 65535 bytes (header + data).", wrong:"512 and 1024 are common buffer sizes but not the IP maximum; 32768 is half the maximum — 65535 is the hard limit."},
  158: {correct:"The Presentation layer (Layer 6) handles data translation, encryption/decryption, and compression — responsible for end-to-end data encryption in OSI.", wrong:"Network layer has IPsec; Transport layer has TLS but it bridges Presentation/Application; Application layer is user-facing."},
  159: {correct:"SMTP (Simple Mail Transfer Protocol) is used for sending emails from client to server and between mail servers, operating on port 25.", wrong:"Receiving emails uses POP3/IMAP; HTTP is for web browsing; FTP is for file transfer — SMTP is exclusively for outgoing mail."},
  160: {correct:"The Vigenère cipher uses a keyword to shift each letter by a different amount, creating multiple substitution alphabets — making it polyalphabetic.", wrong:"Monoalphabetic uses one fixed shift (like Caesar); Transposition rearranges characters; Stream cipher is a modern concept."},
  161: {correct:"Brute-force attack systematically tries every possible key until the correct one is found — guaranteed to succeed given enough time.", wrong:"Dictionary attack uses wordlists; Birthday attack exploits hash collisions; MITM intercepts communications — none try all possible keys."},
  
  // New Advanced Questions Explanations (162 - 181)
  162: {correct:"Linear probing resolves collisions by placing the element in the next available slot, which causes clusters of occupied slots to form and grow, known as primary clustering.", wrong:"Quadratic probing causes secondary clustering. Separate chaining uses linked lists, avoiding clustering entirely."},
  163: {correct:"In an undirected graph, if there is an edge from A to B, there is an edge from B to A. Therefore, matrix[i][j] always equals matrix[j][i], making it symmetric.", wrong:"Directed graphs can be asymmetric. Diagonal matrices only imply self-loops."},
  164: {correct:"Dijkstra's algorithm finds the shortest paths from a single source vertex to all other vertices, provided there are no negative edge weights.", wrong:"Kruskal's and Prim's are for Minimum Spanning Trees. Floyd-Warshall is for all-pairs shortest path."},
  165: {correct:"In the worst-case scenario (e.g., elements inserted in already sorted order), a BST degrades into a linked list, making insertion time O(n).", wrong:"O(log n) is the average case or the worst case for balanced trees like AVL or Red-Black trees, but not a standard BST."},
  166: {correct:"SCAN (also called the elevator algorithm) moves the disk arm across the disk, servicing requests in one direction until it hits the end, then reverses direction.", wrong:"C-SCAN jumps back to the beginning without servicing on the return trip. SSTF goes to the closest request."},
  167: {correct:"TestAndSet is a hardware-level atomic instruction used to implement mutual exclusion locks.", wrong:"Wait and Signal are software operations on semaphores. FetchAndAdd is different, and CompareAndSwap checks a value before swapping."},
  168: {correct:"Segmentation allocates memory in variable-sized blocks based on logical units, which leaves small, unusable holes of memory scattered around—this is external fragmentation.", wrong:"Paging uses fixed-size blocks (frames) and suffers from internal fragmentation, not external."},
  169: {correct:"Each thread requires its own stack and set of CPU registers to execute independently. They share the code, data, and OS resources (like files) of the parent process.", wrong:"Threads share memory (code and data) and open files to communicate easily, but execution state (registers/stack) must be separate."},
  170: {correct:"Write-Ahead Logging (WAL) is the standard protocol ensuring that all changes are written to a log file on stable storage before the actual database is updated.", wrong:"Shadow paging uses copies of pages. Deferred update doesn't write to DB until commit, but WAL is the specific log-before-write rule."},
  171: {correct:"A Theta Join is a Cartesian product followed by a selection operation that filters the resulting rows based on a specific condition (theta).", wrong:"Projection selects columns. Intersection finds common rows. Difference subtracts rows."},
  172: {correct:"A schedule is conflict serializable if you can swap non-conflicting consecutive operations (e.g., Read(A) by T1 and Read(A) by T2) to form a serial schedule.", wrong:"You cannot remove writes or just delay reads. Conflict serializability is strictly about the equivalence of swapping non-conflicting ops."},
  173: {correct:"The Serializable isolation level is the highest level and uses range locks or table-level locks to completely prevent phantom reads (other transactions inserting rows).", wrong:"Read Uncommitted allows dirty reads. Read Committed prevents dirty reads. Repeatable Read prevents non-repeatable reads but allows phantoms."},
  174: {correct:"In TCP, the client sends SYN, the server responds with SYN-ACK (acknowledging the client's request and sending its own sequence number), and the client finishes with ACK.", wrong:"SYN is step 1. ACK is step 3. FIN is used for connection termination."},
  175: {correct:"OSPF (Open Shortest Path First) is an interior gateway protocol that uses Dijkstra's algorithm (SPF) and link-state advertisements to calculate routes.", wrong:"RIP is a Distance Vector protocol. BGP is a Path Vector protocol for inter-domain routing."},
  176: {correct:"A mask of .224 means 3 bits are borrowed for subnets, leaving 5 bits for hosts. 2^5 = 32 total IPs. Subtract 2 (network ID and broadcast) = 30 usable hosts.", wrong:"32 is the total block size, not usable. 14 would be for a .240 mask."},
  177: {correct:"POP3 downloads emails to the local client and, by default, deletes them from the server. IMAP keeps them synchronized on the server.", wrong:"SMTP sends mail. IMAP keeps mail on the server. MIME formats attachments."},
  178: {correct:"The Birthday Paradox highlights that the probability of two different inputs producing the same hash output (a collision) reaches 50% much faster than expected (e.g., at 2^(n/2) tries).", wrong:"It has nothing to do with generating prime numbers, weak keys, or private keys."},
  179: {correct:"In CBC (Cipher Block Chaining) mode, each plaintext block is XORed with the previous ciphertext block before being encrypted, ensuring identical plaintexts encrypt differently.", wrong:"ECB encrypts blocks independently. CTR turns a block cipher into a stream cipher using a counter."},
  180: {correct:"A Certificate Authority (CA) is the trusted third party that verifies an entity's identity and issues the digital certificate binding them to their public key.", wrong:"The RA verifies identity but passes the request to the CA to actually issue the certificate. KDC is used in symmetric systems like Kerberos."},
  181: {correct:"To ensure only Bob can read the message (Confidentiality), Alice must encrypt it using Bob's Public Key. Only Bob possesses the corresponding Private Key to decrypt it.", wrong:"Encrypting with Alice's private key provides signing (authentication), not confidentiality. Encrypting with Bob's private key is impossible as Alice doesn't have it."},

  // Batch 2 Explanations (182 - 206)
  182: {correct:"Using the sift-down (heapify) method from the bottom up, building a heap takes strictly O(n) time. This is a classic optimization over the O(n log n) top-down approach.", wrong:"O(n log n) is for heap sort overall, or building it top-down. The optimal bottom-up build is mathematically proven to be O(n)."},
  183: {correct:"Level-order traversal visits nodes level by level (depth by depth), which is the exact definition of a Breadth-First Search (BFS) algorithm.", wrong:"Pre-order, In-order, and Post-order are all variants of Depth-First Search (DFS) that dive deep into branches before exploring siblings."},
  184: {correct:"A fundamental property of a connected, acyclic graph (a tree) is that if it has N vertices, it must have exactly N-1 edges.", wrong:"N edges would create a cycle. N+1 creates multiple cycles. N-1 is the strict mathematical definition of a tree's edge count."},
  185: {correct:"A Stack is required. When evaluating postfix (e.g., '3 4 +'), you push operands onto the stack and pop them when you encounter an operator.", wrong:"Queues are FIFO, which breaks the order of operations. Trees and Linked Lists do not inherently provide the LIFO behavior needed for evaluation."},
  186: {correct:"In a skewed BST, the tree acts just like a linked list. To find an element, you may have to traverse every single node, resulting in O(n) worst-case time.", wrong:"O(log n) is the time for a balanced BST (like AVL or Red-Black). A generic skewed BST loses this logarithmic advantage."},
  187: {correct:"'No Preemption' is the necessary condition. If resources CAN be preempted (taken away), deadlocks can be easily broken. Therefore, Preemption prevents deadlock.", wrong:"Mutual Exclusion, Hold and Wait, No Preemption, and Circular Wait are the four Coffman conditions for deadlock."},
  188: {correct:"The Process Control Block (PCB) is the data structure the OS uses to store all context about a process, including its state, PC, and registers, required for context switching.", wrong:"Page tables handle memory. The IVT handles hardware interrupts. The TLB is a hardware cache for memory translation."},
  189: {correct:"A Page Fault is a trap to the OS generated by the hardware MMU when a process tries to access a valid virtual memory page that is currently swapped out to the disk.", wrong:"A segfault is an illegal memory access. A system call is a software request. A hardware interrupt comes from external devices."},
  190: {correct:"Thrashing happens when too many processes compete for too little RAM, causing constant swapping. Decreasing the degree of multiprogramming (suspending processes) frees up RAM frames.", wrong:"Faster CPUs or schedulers just process the swapping faster; they don't fix the lack of RAM. The TLB caches addresses, not the actual page data."},
  191: {correct:"Shared Memory is the fastest IPC because once the OS establishes the shared memory region, processes read/write directly to RAM without further system calls or kernel context switches.", wrong:"Pipes, Message Passing, and Sockets all require system calls (kernel intervention) to copy data from user space to kernel space and back."},
  192: {correct:"TRUNCATE is a DDL command that quickly removes all rows by deallocating the data pages, making it much faster than DELETE, which logs every individual row deletion.", wrong:"DELETE removes rows one by one. DROP destroys the entire table structure. REMOVE is not a standard SQL table command."},
  193: {correct:"Third Normal Form (3NF) requires a table to be in 2NF and have no transitive dependencies (where a non-prime attribute depends on another non-prime attribute).", wrong:"Partial dependencies are eliminated in 2NF. Multi-valued dependencies are handled in 4NF."},
  194: {correct:"Durability guarantees that once a transaction commits, the changes survive permanently, usually by writing to non-volatile storage (like a hard drive or SSD log).", wrong:"Atomicity is all-or-nothing. Consistency maintains DB rules. Isolation keeps concurrent transactions separated."},
  195: {correct:"In standard Chen ER notation, a double-lined ellipse (oval) represents a multivalued attribute (an attribute that can hold multiple values, like 'Phone Numbers').", wrong:"Derived attributes are dashed ellipses. Weak entities are double rectangles. Composite attributes are connected ellipses."},
  196: {correct:"CREATE is a Data Definition Language (DDL) command used to define database schema structure. ", wrong:"INSERT and UPDATE are Data Manipulation Language (DML). GRANT is Data Control Language (DCL)."},
  197: {correct:"Routers operate at the Network Layer (Layer 3) of the OSI model. They use logical IP addresses to determine the best path to forward packets across different networks.", wrong:"Switches operate at the Data Link layer. TCP/UDP operate at the Transport layer. HTTP operates at the Application layer."},
  198: {correct:"A MAC (Media Access Control) address is a physical hardware address that is 48 bits long, typically written as six pairs of hexadecimal digits (e.g., 00:1A:2B:3C:4D:5E).", wrong:"32 bits is an IPv4 address. 128 bits is an IPv6 address. 16 bits is a port number."},
  199: {correct:"TCP (Transmission Control Protocol) provides a connection-oriented, reliable, ordered, and error-checked delivery of a stream of bytes.", wrong:"UDP is connectionless and unreliable. IP is connectionless routing. ICMP is for error/control messages (like ping)."},
  200: {correct:"The IP address 127.0.0.1 is the standard IPv4 loopback address. Traffic sent to this address does not hit the network hardware; it loops back to the local machine's IP stack for testing.", wrong:"Subnet masking determines network boundaries. Broadcasting uses specific ending IPs (like 255). Multicasting uses Class D (224.x.x.x)."},
  201: {correct:"An 'A' (Address) record maps a domain name directly to an IPv4 address. (An 'AAAA' record maps to an IPv6 address).", wrong:"CNAME is an alias mapping domain to domain. MX specifies mail servers. TXT holds arbitrary text data."},
  202: {correct:"DSA (Digital Signature Algorithm) is a Federal Information Processing Standard specifically designed for generating digital signatures, not for general data encryption.", wrong:"AES, RC4, and DES are all symmetric algorithms designed specifically for encrypting and decrypting data payloads."},
  203: {correct:"A cryptographic hash function must be deterministic—meaning the exact same input message will always produce the exact same hash output, every single time.", wrong:"Hash functions are fundamentally designed to be irreversible (one-way). They are neither symmetric nor asymmetric (as they do not use keys)."},
  204: {correct:"A 'Salt' is random data added to a password before hashing. It ensures that even if two users have the same password, their hashes look different, thwarting pre-computed rainbow table attacks.", wrong:"Salting does not encrypt the hash, make it reversible, or compress it. It solely defends against bulk pre-computed dictionary/rainbow attacks."},
  205: {correct:"Non-repudiation ensures that the sender cannot deny sending the message, and the recipient cannot deny receiving it. Digital signatures provide non-repudiation.", wrong:"Confidentiality keeps it secret. Integrity proves it wasn't altered. Availability ensures the system stays online."},
  206: {correct:"Diffie-Hellman security relies on the Discrete Logarithm Problem—it is easy to compute g^a mod p, but computationally infeasible to find 'a' knowing only the result, 'g', and 'p'.", wrong:"RSA relies on prime factorization. Elliptic Curve Cryptography relies on EC discrete logs. Matrix inversions are not standard primitives here."},
  
  // === Batch 3 Explanations (207 - 231) ===
  207: {correct:"A Priority Queue is most efficiently implemented using a Heap (specifically a Min-Heap or Max-Heap), which allows O(log n) insertions and extractions.", wrong:"Arrays and Linked Lists take O(n) for either insertion or extraction. Standard queues are strictly FIFO, lacking priority mechanisms."},
  208: {correct:"In a Min-Heap, the minimum element is always at the root. Accessing the root takes O(1) constant time.", wrong:"O(log n) is the time to extract/delete the minimum. Finding/peeking is O(1). O(n) would be searching an unsorted array."},
  209: {correct:"By definition, an AVL tree is a self-balancing binary search tree where the difference in heights (balance factor) of left and right subtrees cannot be more than 1.", wrong:"0 would mean perfectly balanced, which is too strict to maintain efficiently. 2 or more breaks the AVL O(log n) guarantee."},
  210: {correct:"Depth-First Search (DFS) can detect cycles in a directed graph by keeping track of the recursion stack (back edges).", wrong:"BFS is generally used for shortest paths in unweighted graphs. Kruskal's and Prim's are for Minimum Spanning Trees."},
  211: {correct:"If you enqueue by pushing to Stack 1, it takes O(1) time. Dequeue requires popping everything to Stack 2 (O(n)), but amortized over many operations, enqueue is O(1).", wrong:"O(n) is the worst-case time for dequeue in this setup. O(log n) and O(n²) do not apply to basic stack operations."},
  212: {correct:"Best Fit searches the entire memory list to find the smallest hole that is large enough to satisfy the request, minimizing wasted leftover space.", wrong:"First Fit takes the first available hole. Worst Fit takes the largest hole. Next Fit searches from the last placement."},
  213: {correct:"The TLB is a high-speed hardware cache inside the MMU that stores recent virtual-to-physical page table translations, avoiding slow RAM lookups.", wrong:"It does not store file data, CPU instructions, or process states (that is the PCB). It strictly caches page table entries."},
  214: {correct:"The 1st process executes P(), changing the value to 0, and enters. The 2nd and 3rd processes execute P(), see the value is 0, and are placed in the blocked/waiting queue.", wrong:"A binary semaphore cannot go negative, and it cannot allow multiple processes into the critical section simultaneously."},
  215: {correct:"Belady's Anomaly occurs in the FIFO (First-In-First-Out) page replacement algorithm, where adding more memory frames paradoxically increases page faults.", wrong:"LRU and Optimal algorithms are stack algorithms and are mathematically proven to be immune to Belady's Anomaly."},
  216: {correct:"Seek Time is the time it takes for the mechanical disk arm to move the read/write head to the correct track or cylinder.", wrong:"Rotational Latency is the time waiting for the sector to spin under the head. Transfer Time is the actual reading speed."},
  217: {correct:"In the relational database model, the 'degree' (or arity) of a relation refers to the total number of columns (attributes) it has.", wrong:"The number of rows/tuples is called the 'cardinality'. Primary keys and relations are structural constraints, not degree."},
  218: {correct:"Fourth Normal Form (4NF) is specifically designed to eliminate independent Multivalued Dependencies (MVDs) from a relation.", wrong:"2NF eliminates partial dependencies. 3NF eliminates transitive dependencies. BCNF deals with overlapping candidate keys."},
  219: {correct:"A Dirty Read occurs when a transaction reads data that has been modified by another transaction that has not yet committed. If the other transaction rolls back, the read data is invalid.", wrong:"Unrepeatable reads happen when data changes between reads. Phantom reads happen when new rows are inserted."},
  220: {correct:"COMMIT and ROLLBACK are part of TCL (Transaction Control Language), which manages changes made by DML statements.", wrong:"DDL creates schemas (CREATE). DML modifies data (INSERT). DCL manages permissions (GRANT)."},
  221: {correct:"A Clustered Index alters the physical storage of the table so that the rows are stored on disk in the exact sorted order of the index key.", wrong:"A Non-Clustered index creates a separate logical pointer structure but leaves the physical table rows unsorted."},
  222: {correct:"Port 443 is the universally assigned well-known port for HTTPS (HTTP Secure over TLS/SSL).", wrong:"Port 80 is plain HTTP. Port 21 is FTP. Port 22 is SSH."},
  223: {correct:"The Data Link Layer (Layer 2) is responsible for framing packets into frames and handling physical MAC addressing for local delivery.", wrong:"Network layer (L3) handles logical IP addressing. Physical layer (L1) handles raw bits. Transport layer (L4) handles ports."},
  224: {correct:"CSMA/CD stands for Carrier Sense Multiple Access with Collision Detection, the protocol historically used by Ethernet to detect jammed signals on a wire.", wrong:"Collision Avoidance (CA) is used in Wi-Fi (802.11), not traditional wired Ethernet."},
  225: {correct:"ARP (Address Resolution Protocol) broadcasts a request on the local network to find the hardware MAC address associated with a known IP address.", wrong:"DNS maps domains to IPs. DHCP assigns IPs to computers. NAT translates private IPs to public IPs."},
  226: {correct:"Class D (224.0.0.0 to 239.255.255.255) is exclusively reserved for IP Multicasting.", wrong:"Class A, B, and C are for standard unicast host assignments. Class E is reserved for experimental use."},
  227: {correct:"In the RSA key generation algorithm, 'n' is the modulus for both the public and private keys, mathematically derived by multiplying two large distinct prime numbers (p * q).", wrong:"The primes themselves are kept secret. 'e' is the public exponent. The discrete logarithm is the basis of Diffie-Hellman, not RSA."},
  228: {correct:"In a Man-in-the-Middle (MITM) attack, the attacker secretly intercepts and alters the communication between two parties who believe they are communicating directly.", wrong:"Replay attacks resend old data. Brute-force guesses keys. Denial of Service takes servers offline."},
  229: {correct:"AES (Advanced Encryption Standard) processes data in fixed block sizes of exactly 128 bits, regardless of whether the key size is 128, 192, or 256 bits.", wrong:"DES uses 64-bit blocks. SHA-256 uses 512-bit message blocks. 256 bits in AES refers to the key size, not the data block size."},
  230: {correct:"ECC is based on the algebraic structure of elliptic curves over finite fields, offering equal security to RSA but with significantly smaller key sizes.", wrong:"Integer factorization is RSA. Symmetric block ciphers are AES. Hashes use compression functions."},
  231: {correct:"SHA-256 (Secure Hash Algorithm 256-bit) produces a 256-bit (32-byte) fixed-size hash digest.", wrong:"MD5 produces 128 bits. SHA-1 produces 160 bits. SHA-512 produces 512 bits."},

  // === Batch 4 Explanations (232 - 281) ===
  // Data Structures
  232: {correct:"In an AVL tree, the strict height balancing guarantees that the maximum height of the tree is strictly bounded by O(log n). Therefore, the worst-case search time is guaranteed to be O(log n).", wrong:"O(n) is the worst-case for a standard, unbalanced Binary Search Tree (which can skew into a linked list). AVL prevents this."},
  233: {correct:"A Bipartite graph is a graph whose vertices can be divided into two disjoint sets such that every edge connects a vertex in one set to a vertex in the other. This is mathematically equivalent to being 2-colorable.", wrong:"A Complete graph has edges between all vertices. A DAG has no cycles. A Tree is a specific type of bipartite graph, but 'Bipartite' is the exact definition of 2-colorable."},
  234: {correct:"Heap Sort relies on building a heap (O(n)) and then extracting the maximum element n times, where each extraction (heapify) takes O(log n). Therefore, it guarantees O(n log n) in all cases.", wrong:"Quick Sort can degrade to O(n²) in the worst case. O(n) is impossible for a comparison-based sort. O(log n) is a search time, not a sort time."},
  235: {correct:"In double hashing, the interval between probes is computed by a second hash function. The formula is (hash1(k) + i * hash2(k)) % m, which effectively eliminates secondary clustering.", wrong:"Linear probing adds 'i'. Quadratic probing adds 'i²'. Chaining uses linked lists instead of probing."},
  236: {correct:"Depth-First Search (DFS) inherently uses a LIFO (Last-In-First-Out) structure to explore as deep as possible before backtracking. This can be implemented via the call stack (recursion) or an explicit Stack.", wrong:"Queue is used for BFS. Priority Queue is used for Dijkstra/Prim. Hash Table is used for fast lookups."},
  237: {correct:"Topological Sorting is only possible for Directed Acyclic Graphs (DAGs). If the graph contains a cycle, there is no valid linear ordering of vertices that respects all directed edges.", wrong:"Undirected graphs cannot be topologically sorted because direction implies prerequisite order. Cyclic graphs create unresolvable circular dependencies."},
  238: {correct:"A Trie (Prefix Tree) stores characters at each node, making it exceptionally fast for prefix matching, auto-complete features, and dictionary implementations.", wrong:"B-Trees are for disk storage/databases. AVL Trees are for general sorted data. Heaps are for priority queues."},
  239: {correct:"In a Red-Black Tree, one of the defining properties is that every path from a given node to any of its descendant NIL (leaf) nodes contains exactly the same number of black nodes.", wrong:"The root is always black. Red nodes cannot have red children. It is not perfectly height-balanced like an AVL tree (it is only roughly balanced)."},
  240: {correct:"According to the Master Theorem for T(n) = aT(n/b) + O(n^d), if a = b^d, the time complexity is O(n^d log n). For Merge Sort, a=2, b=2, d=1. Since 2 = 2^1, the complexity is O(n log n).", wrong:"O(n) applies if a < b^d. O(n^2) applies to algorithms like Bubble Sort. The Master Theorem precisely dictates O(n log n) here."},
  241: {correct:"Floyd's Cycle-Finding Algorithm uses two pointers moving at different speeds (a 'tortoise' moving 1 step, a 'hare' moving 2 steps). If there is a loop, they will eventually meet.", wrong:"Dijkstra's finds shortest paths. Kruskal's finds minimum spanning trees. Kosaraju's finds strongly connected components."},

  // Operating System
  242: {correct:"An Inverted Page Table has one entry for each physical frame in memory, rather than one entry for each virtual page. This significantly reduces the memory overhead required to store the table.", wrong:"Multilevel paging creates a hierarchy. Demand paging loads pages as needed. Segmentation divides memory by logical structure."},
  243: {correct:"A Mutex (Mutual Exclusion object) incorporates an ownership concept; only the specific thread that acquired the mutex can release it. A Semaphore is just a counter and can be signaled by any thread.", wrong:"Both can be used across threads. Semaphores can have values greater than 1 (counting semaphores). Spinlocks use busy-waiting."},
  244: {correct:"SRTF is a preemptive algorithm that always schedules the shortest remaining job. If short jobs continuously arrive, long jobs will never get CPU time, leading to starvation.", wrong:"Round Robin prevents starvation. FCFS prevents starvation (eventually). Priority scheduling causes starvation, but SRTF is the specific burst-based algorithm."},
  245: {correct:"A Multilevel Feedback Queue allows a process to move between different priority queues based on its behavior (e.g., CPU-bound jobs are moved to lower priority queues, I/O-bound jobs stay high).", wrong:"A standard Multilevel Queue fixes processes to a specific queue permanently. Round Robin uses a single queue."},
  246: {correct:"The Working Set Model tracks the set of pages a process is actively referencing over a specific time window. The OS uses this to allocate enough frames to prevent thrashing.", wrong:"Belady's anomaly relates to FIFO. Demand paging is the general concept of loading on demand. Thrashing is the problem the Working Set Model tries to solve."},
  247: {correct:"RAID 5 distributes block-level data and parity information across all drives in the array. This provides fault tolerance (can survive one drive failure) while utilizing storage efficiently.", wrong:"RAID 0 has no parity. RAID 1 is mirroring. RAID 6 uses dual parity (survives two failures)."},
  248: {correct:"The fork() system call returns the Process ID (PID) of the newly created child process to the parent, and returns 0 to the child process. It returns -1 if the creation fails.", wrong:"It doesn't return 1 to the parent. It returns a specific PID integer. Returning 0 to both would make it impossible to differentiate the processes in the code."},
  249: {correct:"In a Hard Real-Time System, missing a deadline is considered a total system failure (e.g., pacemaker, anti-lock brakes). In a Soft Real-Time System, missing a deadline degrades quality but isn't fatal (e.g., video streaming).", wrong:"Preemption, multithreading, and batch processing do not define the 'hard' vs 'soft' distinction—the consequence of missing a deadline does."},
  250: {correct:"Spooling (Simultaneous Peripheral Operations On-Line) buffers data in memory/disk so a slow device (like a printer) can access it at its own pace while the CPU moves on to other tasks.", wrong:"Paging manages RAM. Swapping moves processes to disk. Context switching changes the active CPU process."},
  251: {correct:"During a context switch, the OS must save the current process's state (registers, PC) into its PCB, and load the new process's state. This takes time, during which the CPU does no useful application work.", wrong:"It does not require a reboot. It does not cause a memory leak. It is not instantaneous; the overhead is a major consideration in OS design."},

  // Database Management System
  252: {correct:"In a B+ Tree, all data records are stored strictly at the leaf level, and all leaf nodes are linked together via pointers. This linked list structure allows for extremely fast range queries.", wrong:"B-Trees store data in internal nodes. Hash indexes do not support range queries. AVL trees do not link leaf nodes sequentially."},
  253: {correct:"MVCC (Multi-Version Concurrency Control) provides isolation by keeping multiple versions of a data item. This allows readers to access a consistent snapshot of the database without blocking writers.", wrong:"Two-Phase Locking (2PL) blocks reads if a write lock is held. Write-Ahead Logging is for Durability. Shadow Paging is for Atomicity."},
  254: {correct:"A Natural Join implicitly matches columns with the exact same name in both tables and removes the duplicate column from the result set.", wrong:"An Inner Join requires an explicit ON clause. A Cross Join creates a Cartesian product. An Outer Join includes unmatched rows."},
  255: {correct:"Conflict serializability checks if non-conflicting operations can be swapped. View serializability is less strict; a schedule can be view serializable even if it contains blind writes that make it non-conflict serializable.", wrong:"Conflict serializability is stricter. Both deal with correctness. Neither allows dirty reads (which violate isolation)."},
  256: {correct:"A Primary Index is built on a field that is both the Primary Key and dictates the physical sequential ordering of the file. A Secondary index is built on a non-ordering field.", wrong:"Clustered indexes dictate physical order but aren't necessarily primary keys. Dense indexes have an entry for every record."},
  257: {correct:"In log-based recovery, the 'Redo' phase replays committed transactions to ensure durability, while the 'Undo' phase reverses the effects of uncommitted transactions to maintain atomicity.", wrong:"Redo does not reverse changes. Shadow paging is a different technique entirely. Checkpointing limits the log scanning but doesn't replace Undo/Redo."},
  258: {correct:"The CAP Theorem states that a distributed database can only guarantee two out of three properties simultaneously: Consistency, Availability, and Partition Tolerance.", wrong:"Atomicity, Concurrency, and Isolation are ACID properties. Confidentiality, Integrity, Availability are CIA triad properties."},
  259: {correct:"When REVOKE is executed with the CASCADE option, the system revokes the privilege from the specified user AND automatically revokes it from any other users to whom that user had granted it.", wrong:"RESTRICT prevents the revocation if dependents exist. CASCADE propagates the revocation down the chain."},
  260: {correct:"The ON DELETE CASCADE constraint ensures that if a record in the parent table is deleted, all corresponding records in the child table (referencing the parent via foreign key) are automatically deleted.", wrong:"ON DELETE SET NULL leaves the child records but removes the reference. ON DELETE RESTRICT blocks the parent deletion."},
  261: {correct:"A Functional Dependency X -> Y is considered 'trivial' if Y is a subset of X. For example, {A, B} -> {A} is trivial because it is logically impossible for it to be false.", wrong:"Transitive dependency involves three attributes (X->Y, Y->Z). Multivalued dependency requires multiple independent values."},

  // Computer Networks
  262: {correct:"A /26 CIDR prefix leaves 6 bits for the host ID (32 - 26 = 6). The total number of IP addresses is 2^6 = 64. Subtracting the network and broadcast addresses leaves 62 usable hosts.", wrong:"126 is for /25. 30 is for /27. 254 is for /24."},
  263: {correct:"BGP (Border Gateway Protocol) is a Path-Vector protocol used to exchange routing and reachability information between different Autonomous Systems (AS) on the internet.", wrong:"OSPF and IS-IS are Link-State protocols used within an AS. RIP is a Distance-Vector protocol."},
  264: {correct:"Wireless networks (802.11) cannot reliably detect collisions while transmitting. Therefore, they use CSMA/CA (Collision Avoidance) relying on RTS/CTS mechanisms instead of Collision Detection (CD).", wrong:"CSMA/CD is used for wired Ethernet. ALOHA is a legacy radio protocol. Token Ring passes a token for access."},
  265: {correct:"TCP Flow Control is managed using a Sliding Window. The receiver advertises its 'window size' to the sender, dictating exactly how much unacknowledged data the sender is allowed to transmit.", wrong:"Congestion Control handles network drops. 3-Way Handshake establishes connections. Checksums handle error detection."},
  266: {correct:"An IPv6 address is exactly 128 bits long, represented as eight groups of four hexadecimal digits. This vast address space was created to solve IPv4 exhaustion.", wrong:"32 bits is IPv4. 48 bits is a MAC address. 64 bits is not standard for IP."},
  267: {correct:"OSPF (Open Shortest Path First) is a Link-State routing protocol. Every router constructs a full topological map of the network and uses Dijkstra's algorithm to find the shortest path.", wrong:"RIP is Distance Vector. BGP is Path Vector. Hybrid applies to EIGRP."},
  268: {correct:"MAC Spoofing occurs when an attacker alters the factory-assigned MAC address of their network interface card to bypass access controls or impersonate another device on the LAN.", wrong:"IP spoofing alters the IP header. ARP Poisoning corrupts the ARP cache. Phishing is a social engineering attack."},
  269: {correct:"The UDP header is extremely lightweight, consisting of exactly 8 bytes: Source Port (2), Destination Port (2), Length (2), and Checksum (2).", wrong:"The standard TCP header is 20 bytes. The IPv4 header is typically 20 bytes."},
  270: {correct:"IMAP (Internet Message Access Protocol) is specifically designed to synchronize emails across multiple devices, keeping the emails on the server. POP3 traditionally downloads and deletes them.", wrong:"SMTP sends mail, it doesn't retrieve it. FTP transfers files. SNMP is for network management."},
  271: {correct:"In the Transport Layer, Multiplexing means gathering data from multiple application processes and adding port numbers to form segments. Demultiplexing uses those port numbers to deliver segments to the correct application.", wrong:"IP addresses are used for routing (Network layer). MAC addresses are for local delivery (Data Link layer). Encryption is Presentation layer."},

  // Cryptography
  272: {correct:"X.509 is the universal ITU-T standard defining the format of Public Key Certificates used in many internet protocols, including SSL/TLS.", wrong:"AES-256 is an encryption standard. SHA-3 is a hash. RSA-2048 is a key generation algorithm."},
  273: {correct:"Block ciphers require plaintext to be an exact multiple of the block size. PKCS#7 is a standard padding scheme that appends bytes with the value of the number of bytes added.", wrong:"Salting is for hashes. Initialization Vectors (IV) randomize the first block. Hashing creates digests."},
  274: {correct:"An Initialization Vector (IV) is a random or pseudo-random value used in block cipher modes (like CBC) to ensure that identical plaintexts encrypt to different ciphertexts.", wrong:"A nonce prevents replay attacks. A digital signature provides non-repudiation. A salt protects passwords."},
  275: {correct:"OAEP (Optimal Asymmetric Encryption Padding) is widely used with RSA to add randomness to the plaintext before encryption, preventing deterministic and chosen-ciphertext attacks.", wrong:"PKCS#7 is for symmetric block ciphers. HMAC is for message authentication. Diffie-Hellman is for key exchange."},
  276: {correct:"The Data Encryption Standard (DES) uses a 64-bit key, but 8 bits are reserved for parity checking. Therefore, the effective cryptographic key space is exactly 56 bits.", wrong:"64 bits is the block size. 128 bits and 256 bits belong to AES."},
  277: {correct:"A MAC (Message Authentication Code), such as HMAC, fundamentally differs from a standard hash because it requires a secret cryptographic key, ensuring that only a key-holder can verify the integrity and authenticity.", wrong:"A hash provides integrity but not authenticity (anyone can compute it). Both produce fixed sizes. MACs do not encrypt data."},
  278: {correct:"Kerberos is a widely used network authentication protocol built entirely on Symmetric Key Cryptography. It uses a trusted Key Distribution Center (KDC) to issue ticketing grants.", wrong:"RSA and Diffie-Hellman are asymmetric. Kerberos does not use public/private key pairs natively."},
  279: {correct:"Perfect Forward Secrecy ensures that if a server's long-term private key is compromised in the future, past recorded communications cannot be decrypted. Ephemeral Diffie-Hellman (DHE) provides this.", wrong:"Non-repudiation prevents denial. Data integrity prevents tampering. Authentication verifies identity."},
  280: {correct:"Steganography is the practice of hiding the very existence of a message (e.g., embedding data in the least significant bits of an image file). Cryptography scrambles the message, but its existence is obvious.", wrong:"Hashing destroys data reversibility. Obfuscation makes code hard to read. Watermarking protects copyright."},
  281: {correct:"A Zero-Knowledge Proof is a cryptographic method where one party (the prover) can prove to another party (the verifier) that they possess specific knowledge without revealing the knowledge itself.", wrong:"Homomorphic encryption allows computation on encrypted data. Quantum cryptography uses quantum mechanics. A digital signature proves origin."},
// === Batch 5 Explanations (282 - 331) ===
  // Data Structures
  282: {correct:"In an Adjacency List, you need an array of size V (vertices) to store the lists, and the lists themselves will contain a total of 2E elements (for an undirected graph) or E elements (for a directed graph). Thus, the space complexity is exactly O(V + E).", wrong:"O(V²) is the space complexity for an Adjacency Matrix, which is highly inefficient for sparse graphs. O(E) ignores the vertices array."},
  283: {correct:"The load factor (α) is a crucial metric in hash tables defined as the number of stored elements (n) divided by the total number of slots/buckets (m). When α gets too high, the table must be resized.", wrong:"It has nothing to do with bucket capacity (which is usually 1 or a linked list) or memory fragmentation ratios."},
  284: {correct:"A Threaded Binary Tree utilizes the 'wasted' NULL pointers in leaf nodes to point to their in-order predecessors or successors. This allows an incredibly fast, linear in-order traversal without needing the overhead of a system call stack or recursion.", wrong:"It does not speed up insertion, guarantee balancing (like AVL), or allow O(1) searches. Its sole optimization is memory-efficient traversal."},
  285: {correct:"If you build a priority queue using an unsorted array, inserting is O(1) (just append to the end). However, extracting the maximum/minimum requires scanning the entire array every time, which takes O(n).", wrong:"O(log n) is the extraction time for a Heap, which is the standard, optimized way to implement a priority queue."},
  286: {correct:"A Treap is a randomized binary search tree. Each node stores a 'key' (following BST ordering rules) and a randomly assigned 'priority' (following Max/Min Heap structural rules), balancing the tree probabilistically.", wrong:"Trie is a prefix tree. Red-Black is a color-coded self-balancing tree. A B-Tree is for disk storage."},
  287: {correct:"Radix Sort is a non-comparative integer sorting algorithm that processes numbers digit by digit, usually starting from the Least Significant Digit (LSD) to the Most Significant Digit (MSD), grouping them using a stable sort like Counting Sort.", wrong:"Quick Sort, Merge Sort, and Heap Sort are all comparative sorts that compare whole values against each other, bounded by O(n log n)."},
  288: {correct:"An Articulation Point (or Cut Vertex) is a node in an undirected graph that, if removed (along with its incident edges), splits a connected graph into two or more disconnected components. It represents a single point of failure.", wrong:"A bridge is an edge (not a vertex) that does the same thing. A source or sink is related to flow networks."},
  289: {correct:"A Monotonic Stack maintains its elements in a strictly increasing or decreasing order. It is the optimal O(n) approach for finding the 'Next Greater Element' or calculating the largest rectangular area in a histogram.", wrong:"Shortest path uses Dijkstra's (Priority Queue). Cycle detection uses DFS. Minimum Spanning Tree uses Disjoint Sets."},
  290: {correct:"The Disjoint Set (Union-Find) achieves an incredible near-O(1) amortized time complexity per operation by using Path Compression (flattening the tree during Find) and Union by Rank (attaching the shallower tree under the deeper one).", wrong:"Hashing, lazy propagation, chaining, and probing belong to Hash Tables and Segment Trees, not Disjoint Sets."},
  291: {correct:"A B-Tree of order 'm' is designed to stay bushy and shallow. To ensure this, every internal node (except the root) must have at least ceil(m/2) children, and at most 'm' children.", wrong:"m-1 is the maximum number of keys a node can hold. log(m) and 2m are incorrect constraints for B-Trees."},

  // Operating System
  292: {correct:"In the Readers-Writers synchronization problem, any number of readers can access the shared resource simultaneously because reading does not mutate data. However, a writer must have strict exclusive access to prevent data corruption.", wrong:"If writers could write simultaneously, race conditions would corrupt the data. If readers needed exclusive access, it would severely bottleneck concurrency."},
  293: {correct:"LRU (Least Recently Used) is a 'Stack Algorithm'. Mathematical properties of stack algorithms guarantee that increasing the number of physical memory frames will never increase the number of page faults, making it immune to Belady's Anomaly.", wrong:"FIFO frequently suffers from Belady's Anomaly. LFU and Random replacement are not immune either."},
  294: {correct:"Priority Inversion happens when a high-priority task is blocked by a low-priority task holding a mutex. The Priority Inheritance Protocol solves this by temporarily elevating the low-priority task's priority to match the high-priority task until it releases the mutex.", wrong:"Aging prevents starvation, not inversion. Preemption causes the inversion problem if a mutex is held. Context switching is a mechanism, not a protocol."},
  295: {correct:"An inode contains deep metadata (permissions, owner, size, timestamps, block pointers). The file's actual 'name' is stored in the Directory File, which maps the human-readable string name to the inode number.", wrong:"Permissions, size, and data block pointers are the exact fundamental data stored inside the inode."},
  296: {correct:"In a Many-to-One model, all user-level threads map to a single kernel thread. The kernel is completely unaware of the user threads. If one user thread makes a blocking system call, the kernel blocks the entire process.", wrong:"The OS cannot preempt a specific user thread because it doesn't know it exists. The entire process halts."},
  297: {correct:"If a Resource Allocation Graph contains a cycle AND every resource type has exactly one instance, a deadlock has definitively occurred. (If there are multiple instances, a cycle is necessary but not sufficient for deadlock).", wrong:"It does not imply starvation, safety, or mutual exclusion. Single-instance cycles are mathematical proof of a deadlock state."},
  298: {correct:"The Buddy System allocates memory by repeatedly halving the memory block until it reaches the smallest power of 2 that can fit the requested size. This makes coalescing (merging free blocks) extremely fast.", wrong:"Prime numbers, Fibonacci sequences, or page sizes (4KB) are not used for Buddy System dividing logic."},
  299: {correct:"Direct Memory Access (DMA) uses a specialized hardware controller to transfer blocks of data between I/O devices and main memory. The CPU only initiates the transfer and receives an interrupt when it finishes, saving massive CPU cycles.", wrong:"DMA doesn't format disks, execute code, or bypass the cache for execution. It is strictly a high-speed data transfer mechanism."},
  300: {correct:"C-SCAN (Circular SCAN) moves the head from one end of the disk to the other, servicing requests. When it hits the end, it immediately jumps back to the beginning without servicing requests on the return trip, providing a more uniform wait time than standard SCAN (Elevator).", wrong:"SSTF jumps erratically. FCFS is slow. LOOK is similar but stops at the last request instead of the disk edge."},
