  301: {correct:"A Microkernel keeps the core kernel extremely small (only IPC, basic scheduling, and memory management). Everything else—file systems, device drivers, network stacks—runs as services in User Space to improve stability and security.", wrong:"Monolithic kernels keep everything in kernel space. Virtualization relies on hypervisors. Firmware is embedded hardware code."},

  // Database Management System
  302: {correct:"In standard ER modeling (Chen notation), a double line connecting an entity set to a relationship set indicates Total Participation—meaning every entity in that set must participate in at least one relationship instance.", wrong:"A single line means partial participation. Weak entities are double rectangles. Identifying relationships are double diamonds."},
  303: {correct:"COUNT(*) counts every single row in the result set, including rows that consist entirely of NULLs. COUNT(column_name) specifically ignores NULL values in that column and only counts non-null entries.", wrong:"No aggregate function crashes on NULLs. SUM, AVG, MIN, and MAX all ignore NULL values silently."},
  304: {correct:"The Relational Algebra Division operator (÷) is uniquely suited for queries that require a 'for all' condition. For example, 'Find all students who have taken EVERY course offered by the CS department.'", wrong:"Joins answer 'matching' queries. Projection answers 'subset' queries. Selection answers 'filtering' queries."},
  305: {correct:"Boyce-Codd Normal Form (BCNF) is a stricter version of 3NF. For a relation to be in BCNF, every determinant (the left side 'X' of an X -> Y dependency) must be a candidate key or superkey.", wrong:"If X is just a prime attribute, it might only satisfy 3NF. BCNF strictly eliminates all anomalies based on functional dependencies."},
  306: {correct:"RAID 1 utilizes exact disk mirroring. Data written to one drive is simultaneously written to a second drive, providing 100% redundancy but halving the total usable storage capacity. It uses no striping or parity.", wrong:"RAID 0 is striping only. RAID 5 uses distributed parity. RAID 6 uses dual parity."},
  307: {correct:"A Cascading Rollback occurs when transaction T1 fails, forcing T2 to roll back because T2 read uncommitted data from T1. A schedule is 'recoverable' and avoids this if transactions only read data from ALREADY COMMITTED transactions.", wrong:"Serializability is about concurrency correctness, not rollback cascading. Deadlock avoidance does not prevent dirty reads."},
  308: {correct:"An Assertion is a piece of SQL DDL that specifies a boolean condition that must NEVER evaluate to false across the entire database. It is evaluated whenever the database state changes, independent of specific table triggers.", wrong:"Triggers are attached to specific tables and actions (INSERT/UPDATE). Assertions are database-wide logical constraints."},
  309: {correct:"In a Dense Index, the index file contains a record (entry) for every single search-key value present in the data file. In a Sparse Index, entries are only created for a subset of the search-key values (usually one per data block).", wrong:"Clustered indexing dictates physical order. Hash indexing uses hash functions, not sequential index files."},
  310: {correct:"Thomas' Write Rule states that if a transaction tries to write to a data item, but a 'younger' (more recent) transaction has already written to it, the older write is obsolete and can be safely ignored (dropped) instead of rolling back the older transaction.", wrong:"It doesn't ignore reads, elevate locks, or bypass two-phase locking. It strictly optimizes obsolete writes."},
  311: {correct:"Data Independence is a core DBMS concept. Logical Data Independence allows changing the conceptual schema (adding columns/tables) without breaking external views/apps. Physical Data Independence allows changing storage structures without altering the conceptual schema.", wrong:"It doesn't refer to isolating transactions (ACID), preventing deadlocks, or exporting to CSVs."},

  // Computer Networks
  312: {correct:"The IPsec ESP (Encapsulating Security Payload) protocol encrypts the payload, providing data confidentiality. The AH (Authentication Header) protocol only provides origin authentication and data integrity, leaving the payload in plaintext.", wrong:"IKE is for key exchange. TLS operates at the Transport layer, not the Network layer (IPsec)."},
  313: {correct:"During TCP's 'Slow Start' phase, the congestion window (cwnd) begins at 1 MSS and grows exponentially (doubling every Round Trip Time) by adding 1 MSS for every ACK received, until it hits the threshold.", wrong:"It grows linearly during the 'Congestion Avoidance' phase. It never shrinks unless a timeout or triple duplicate ACK occurs."},
  314: {correct:"Variable Length Subnet Masking (VLSM) allows a network engineer to divide an IP address space into a hierarchy of subnets of different sizes, drastically reducing wasted IP addresses compared to classful networking.", wrong:"NAT translates private to public. DHCP assigns IPs dynamically. VLANs create logical layer 2 segments."},
  315: {correct:"A Cut-Through switch is extremely fast because it begins transmitting the frame out the destination port the millisecond it reads the 6-byte Destination MAC address at the start of the frame, before receiving the rest of the payload.", wrong:"Store-and-forward waits for the entire frame and checks the CRC. Fragment-free waits for the first 64 bytes."},
  316: {correct:"The HTTP PUT method is strictly defined as idempotent. It is used to create or replace a resource at a specific URI. Calling it once has the same effect on the server state as calling it 100 times with the same payload.", wrong:"POST is not idempotent (creates new resources every time). GET fetches data. PATCH partially updates data."},
  317: {correct:"In CRC error detection, the data is treated as a massive binary number, which is divided by a predetermined generator polynomial. The remainder of this division is appended to the data as the CRC checksum.", wrong:"Parity is a simple bit-count. Checksums are additions. CRC relies strictly on polynomial division (modulo-2 arithmetic)."},
  318: {correct:"Split Horizon dictates that a router will not advertise a route back out the interface it learned it from. Poison Reverse adds to this by advertising the route back with an infinite metric (unreachable), breaking routing loops in Distance Vector protocols.", wrong:"Dijkstra's is used in Link-State, not Distance Vector. OSPF doesn't have this specific problem. BGP uses AS-paths."},
  319: {correct:"The OSI Session Layer (Layer 5) manages dialogues between computers. It establishes, manages, and terminates connections, and can insert checkpoints into data streams so that long transfers can resume from the checkpoint if interrupted.", wrong:"Transport (L4) handles ports. Presentation (L6) handles encryption/compression. Application (L7) faces the user."},
  320: {correct:"Wavelength Division Multiplexing (WDM) combines multiple optical carrier signals onto a single optical fiber by using different wavelengths (colors) of laser light to carry different signals.", wrong:"Twisted pair and Coaxial use Frequency or Time Division. Wireless uses OFDM or CDMA. WDM is strictly for fiber optics."},
  321: {correct:"The Time To Live (TTL) field prevents IP packets from looping infinitely. When a router decrements the TTL to 0, it drops the packet and sends an 'ICMP Time Exceeded' (Type 11) message back to the original sender.", wrong:"Destination Unreachable means no route exists. Echo Reply is for ping. Source Quench was for old congestion control."},

  // Cryptography
  322: {correct:"PGP (Pretty Good Privacy) uses a 'Web of Trust'. Instead of a central CA like VeriSign, users digitally sign each other's public keys, creating a decentralized graph of trust based on personal verification.", wrong:"PKI relies on an explicit hierarchy of trust. Certificate Revocation Lists (CRLs) handle invalid keys. Kerberos uses a trusted KDC."},
  323: {correct:"Galois/Counter Mode (GCM) is widely adopted in modern TLS because it is an AEAD (Authenticated Encryption with Associated Data) mode. It combines CTR mode for encryption with a Galois MAC for simultaneous, highly efficient integrity and authenticity.", wrong:"ECB is insecure. CBC only provides encryption, requiring a separate MAC. OFB is a stream mode."},
  324: {correct:"The ElGamal algorithm is an asymmetric key encryption algorithm for public-key cryptography which is based on the Diffie–Hellman key exchange, relying entirely on the difficulty of computing discrete logarithms in a finite field.", wrong:"RSA relies on Integer Factorization. ECC relies on elliptic curves. AES relies on symmetric substitution-permutation networks."},
  325: {correct:"Because standard Diffie-Hellman does not authenticate the parties, an attacker can intercept the messages, establish separate DH keys with Alice and Bob, and seamlessly decrypt/re-encrypt traffic. This is a classic Man-in-the-Middle (MITM) attack.", wrong:"It is immune to offline brute force and replay (if ephemeral). MITM requires active, real-time interception."},
  326: {correct:"Based on the mathematical Birthday Paradox, the probability of finding a collision (two different inputs producing the same hash) in an n-bit hash function reaches 50% after roughly 2^(n/2) attempts. Thus, a 256-bit hash offers 128-bit collision resistance.", wrong:"2^n would be a pre-image attack. 2^(n/4) and 2^(n*2) are mathematically incorrect for collision bounds."},
  327: {correct:"A Feistel Network (or cipher) divides the data block into two halves (Left and Right). In each round, the Right half is put through a round function with a subkey, XORed with the Left half, and then the halves are swapped. DES is the most famous Feistel cipher.", wrong:"AES uses a Substitution-Permutation Network (SPN). Stream ciphers use keystreams. Hash chains are used in blockchain."},
  328: {correct:"To create a valid Digital Signature, the sender (Bob) hashes the document and encrypts the hash using his OWN Private Key. Anyone can then use Bob's Public Key to decrypt the hash and verify the signature.", wrong:"If he used his public key, anyone could forge it. If he used Alice's keys, it would provide confidentiality, not non-repudiation (signature)."},
  329: {correct:"The ClientHello is the very first message sent to initiate a TLS handshake. The client sends its TLS version, random data, and a list of Cipher Suites (encryption algorithms) it supports, so the server can choose one they both understand.", wrong:"Certificates are sent by the server later. The Pre-Master secret is sent during key exchange. The MAC confirms the handshake at the end."},
  330: {correct:"For a random number generator to be considered cryptographically secure (CSPRNG), it must pass the Next-Bit Test. Even if an attacker observes a sequence of output bits, they must not be able to predict the very next bit with any probability better than a random guess (50%).", wrong:"Repeating every 2^32 bits is too short. Seed extraction implies a vulnerability. Fast prime generation is a utility, not a security test."},
  331: {correct:"While the standard Euclidean algorithm finds the Greatest Common Divisor (GCD), the *Extended* Euclidean algorithm also finds the coefficients of Bézout's identity. In cryptography (like RSA), this is the optimal way to compute the modular multiplicative inverse to find the private key exponent 'd'.", wrong:"Prime factors are found via factorization algorithms. Elliptic points use point addition. Discrete logs use Baby-step Giant-step."},

// === Batch 6 Explanations (332 - 381) ===
  // Data Structures
  332: {correct:"A Splay Tree is a self-adjusting binary search tree with the recent-access property. Accessed elements are moved to the root via rotations (splaying), ensuring that frequently accessed elements have O(1) access time, resulting in an amortized O(log n) time per operation.", wrong:"AVL and Red-Black trees balance strictly by height or color rules, not by access frequency. B-Trees are for disk storage."},
  333: {correct:"Kosaraju's Algorithm and Tarjan's Algorithm are both standard, efficient O(V+E) algorithms specifically designed to find the Strongly Connected Components (SCCs) of a directed graph.", wrong:"Kruskal's is for Minimum Spanning Trees. Dijkstra's is for shortest paths. Floyd-Warshall is for all-pairs shortest paths."},
  334: {correct:"Cuckoo Hashing completely guarantees O(1) worst-case lookup time. It uses two distinct hash functions and two tables. If a collision occurs, the old key is 'kicked out' (like a cuckoo bird) to its alternate location.", wrong:"Linear probing, quadratic probing, and chaining all degrade to O(n) worst-case lookup time if many collisions occur."},
  335: {correct:"A Skip List is a probabilistic data structure built upon multiple layers of linked lists. It uses coin flips (randomization) to build express lanes, allowing it to bypass large sections of data, achieving O(log n) average search time.", wrong:"Treaps use randomization but are binary trees. Hash tables use hashing, not layers of linked lists. Radix trees use string prefixes."},
  336: {correct:"A Fenwick Tree (or Binary Indexed Tree) is highly optimized for calculating prefix sums and updating elements in an array. Both operations take precisely O(log n) time, using bitwise operations to traverse the tree structure.", wrong:"Segment Trees can do this but take more memory. Heaps find max/min, not prefix sums. Tries are for strings."},
  337: {correct:"In amortized analysis, the 'Potential Method' assigns a mathematical potential energy (Φ) to the data structure as a whole. Operations that take less time than their amortized cost build up potential, which pays for expensive operations later.", wrong:"The Aggregate method averages total cost. The Accounting method assigns credits to individual elements. The Master theorem solves recurrences."},
  338: {correct:"Matrix Chain Multiplication is the classic example of a problem with overlapping subproblems and optimal substructure, making it perfectly suited for Dynamic Programming to minimize scalar multiplications.", wrong:"Greedy approaches fail here because local optimums don't guarantee global optimums. Divide and conquer (without memoization) is too slow (exponential)."},
  339: {correct:"Borůvka's algorithm is the oldest MST algorithm. It initializes every vertex as its own component and repeatedly adds the cheapest outgoing edge from each component simultaneously. It is heavily used in parallel computing.", wrong:"Prim's grows a single tree. Kruskal's sorts all edges globally. Dijkstra's finds shortest paths, not spanning trees."},
  340: {correct:"A Suffix Tree (or Suffix Automaton) is an advanced data structure that compresses all suffixes of a string, allowing extremely fast substring searches, pattern matching, and finding the longest repeated substring in O(n) time.", wrong:"A Trie stores whole words or prefixes, not all suffixes inherently. A B-Tree is for disks. A Hash Map doesn't easily support substring queries."},
  341: {correct:"In a B-Tree, when an internal node is full and a new key is inserted, the node splits into two. The median (middle) key is then pushed upwards to be inserted into the parent node.", wrong:"The smallest or largest keys stay in the split nodes. The new key is not guaranteed to move up; only the median of the newly full set does."},

  // Operating System
  342: {correct:"A Spinlock is a lock where the thread continuously loops ('spins') checking if the lock is available. It is only efficient in multiprocessor systems where the lock will be held for an extremely short time, avoiding context switch overhead.", wrong:"On a single processor, a spinlock is a disaster because the spinning thread blocks the thread holding the lock from ever running to release it."},
  343: {correct:"The Completely Fair Scheduler (CFS) is the default CPU scheduler in Linux. It uses a Red-Black Tree to track the 'vruntime' (virtual runtime) of processes, always picking the process with the smallest vruntime to run next.", wrong:"O(1) Scheduler was used in older Linux kernels (2.6). Round Robin and Multilevel Feedback are generic concepts, not the specific Linux default."},
  344: {correct:"Copy-on-Write (CoW) is an optimization for the fork() system call. Instead of duplicating the entire parent memory immediately, both parent and child share the same memory pages. A copy is only made if one of them attempts to modify (write to) a page.", wrong:"It is not used for disk writing, thread creation, or context switching. It is specifically a memory optimization for process creation."},
  345: {correct:"Mattson's Algorithm evaluates page replacement policies. It proves that any policy adhering to the 'inclusion property' (where the contents of an n-frame memory are always a subset of an (n+1)-frame memory) is a Stack Algorithm, meaning it will never suffer from Belady's Anomaly.", wrong:"Banker's Algorithm prevents deadlock. Dekker's Algorithm provides mutual exclusion. Peterson's Algorithm also handles mutual exclusion."},
  346: {correct:"Solid State Drives (SSDs) suffer from physical wear when writing to cells. 'Wear Leveling' is a firmware algorithm that distributes write/erase cycles evenly across all memory blocks to prevent premature failure of specific sectors.", wrong:"Defragmentation is for HDDs. Elevator algorithm is for HDD arms. Spooling is for printers."},
  347: {correct:"In a Microkernel OS, services like file systems and drivers run in User Space. When an application needs a service, it must use Message Passing (IPC) to communicate with it, which introduces significant context switching and performance overhead.", wrong:"Microkernels increase stability and security (if a driver crashes, the kernel survives). However, the IPC overhead is their main performance drawback."},
  348: {correct:"Rate Monotonic Scheduling (RMS) is a static priority algorithm for real-time systems. It assigns higher priority to tasks with shorter periods (higher frequency). It is optimal for static-priority scheduling.", wrong:"Earliest Deadline First (EDF) is dynamic. Round Robin ignores deadlines entirely. FCFS is useless for real-time constraints."},
  349: {correct:"The standard deadlock detection algorithm (based on the Banker's algorithm logic for currently available resources) has a worst-case time complexity of O(m × n²), where 'm' is the number of resource types and 'n' is the number of processes.", wrong:"O(1) and O(log n) are far too fast for complex matrix checking. O(n!) is overly pessimistic."},
  350: {correct:"Thread-Local Storage (TLS) is a specialized memory mechanism that allows global or static variables to be unique to each thread. Even though threads share the same process data segment, TLS variables get a separate instance per thread.", wrong:"The Heap, Code Segment, and open file descriptors are fully shared among all threads in a process."},
  351: {correct:"The Page Fault Frequency (PFF) approach attempts to prevent thrashing dynamically. If a process's page fault rate exceeds a high threshold, the OS gives it more frames. If it drops below a low threshold, the OS takes frames away.", wrong:"The Working Set Model estimates active pages over a time window. Optimal Page Replacement is theoretical. Demand Paging just brings pages in when requested."},

  // Database Management System
  352: {correct:"In DBMS concurrency control, Two-Phase Locking (2PL) explicitly guarantees Conflict Serializability. If all transactions follow 2PL, it is mathematically impossible to generate a non-serializable schedule.", wrong:"2PL does NOT prevent deadlocks (it often causes them). It does not guarantee BCNF (which is a normalization rule) or view serializability exclusively."},
  353: {correct:"The 'Force' policy requires that all modified blocks be written to disk BEFORE a transaction commits. The 'No-Steal' policy dictates that uncommitted transactions cannot overwrite committed data on disk. Most modern databases use No-Force/Steal for performance.", wrong:"Write-Ahead Logging supports No-Force/Steal. Shadow Paging uses No-Steal/Force. The terms refer strictly to buffer management to disk."},
  354: {correct:"In Query Optimization, 'Pushing Selections Down' is a vital heuristic. Applying the SELECT (filter) operation as early as possible reduces the number of rows that must be processed by expensive subsequent operations like JOINs.", wrong:"Pushing projections down is helpful, but selections reduce row count (cardinality), which saves massive memory and CPU overhead during joins."},
  355: {correct:"The Two-Phase Commit (2PC) protocol is used in distributed databases to ensure Atomicity. A coordinator asks all nodes to 'Prepare' (Phase 1). Only if ALL nodes vote yes does the coordinator issue the 'Commit' command (Phase 2).", wrong:"Three-Phase Commit handles coordinator failure better. Paxos is for consensus. WAL is for single-node recovery."},
  356: {correct:"ARIES is an industrial-standard recovery algorithm. Its three phases are strictly: 1. Analysis (find active transactions), 2. Redo (repeat history to recreate the crash state), 3. Undo (reverse uncommitted transactions).", wrong:"The order is strictly Analysis -> Redo -> Undo. Reversing this order breaks the 'repeating history' paradigm."},
  357: {correct:"Fifth Normal Form (5NF), or Project-Join Normal Form (PJNF), specifically addresses and eliminates 'Join Dependencies'. A table is in 5NF if it cannot be broken into smaller tables and perfectly reconstructed without losing or creating spurious rows.", wrong:"4NF handles Multivalued Dependencies. 3NF handles Transitive Dependencies. BCNF handles overlapping candidate keys."},
  358: {correct:"A 'Dirty Write' occurs when two uncommitted transactions try to modify the same data item simultaneously. This is the most dangerous anomaly and is strictly prevented by even the lowest isolation level (Read Uncommitted).", wrong:"Dirty Read is reading uncommitted data. Phantom Read is seeing new rows. Non-repeatable read is seeing changed data."},
  359: {correct:"A Hash Join is usually the most efficient algorithm for computing Equi-Joins (where the join condition is strictly '='), especially on large, unsorted datasets. It builds a hash table on the smaller relation and probes it with the larger.", wrong:"Nested Loop Join is a fallback. Sort-Merge Join is best if data is already sorted or if it's a range join (>, <). Hash joins only work for equality."},
  360: {correct:"A Materialized View differs from a standard View because it physically stores the result of the query on disk. This greatly speeds up complex read queries but requires a 'View Maintenance' strategy to keep the data updated when base tables change.", wrong:"Standard views are just saved SQL queries (virtual). Indexed views are a specific SQL Server term. Temporary tables delete on session close."},
  361: {correct:"In distributed NoSQL systems, the BASE acronym stands for Basically Available, Soft state, Eventual consistency. It prioritizes availability and partition tolerance over strict ACID consistency.", wrong:"ACID requires immediate consistency. BASE accepts that nodes may temporarily disagree, as long as they eventually synchronize."},

  // Computer Networks
  362: {correct:"In TCP Fast Recovery, when a sender receives three duplicate ACKs, it assumes a single packet was lost. It halves the congestion window (instead of dropping it to 1) and immediately retransmits the missing packet (Fast Retransmit), avoiding the slow start phase.", wrong:"Timeouts drop the window to 1. Fast Start is not a TCP term. Checksums trigger silent drops, not fast recovery."},
  363: {correct:"In the IPv6 header, the 'Next Header' field replaces the IPv4 'Protocol' field. It identifies the type of header immediately following the IPv6 header (e.g., TCP, UDP, or an Extension Header).", wrong:"Traffic Class replaces Type of Service. Flow Label is new for QoS. Hop Limit replaces Time To Live (TTL)."},
  364: {correct:"In BGP (Border Gateway Protocol), the 'Local Preference' attribute is used to influence outbound traffic. It tells routers within the SAME Autonomous System which path is preferred to exit the network (higher is better).", wrong:"MED (Multi-Exit Discriminator) influences inbound traffic. AS-Path prevents loops. Weight is Cisco-proprietary."},
  365: {correct:"IEEE 802.1Q is the networking standard that supports Virtual LANs (VLANs) on an Ethernet network. It works by inserting a 4-byte VLAN tag into the Ethernet frame header.", wrong:"802.11 is Wi-Fi. 802.3 is standard Ethernet. 802.1X is port-based Network Access Control (PNAC)."},
  366: {correct:"Dynamic ARP Inspection (DAI) is a security feature on enterprise switches that intercepts ARP packets and compares them against a trusted binding table (usually built by DHCP snooping) to block ARP spoofing attacks.", wrong:"Port Security blocks unauthorized MACs. IPsec encrypts L3 traffic. DNSSEC secures DNS, not ARP."},
  367: {correct:"In an Iterative DNS query, the client directly asks root, TLD, and authoritative servers one by one. In a Recursive query, the client asks a local resolver, and the resolver takes on the burden of querying the internet and returning the final answer.", wrong:"Authoritative means the server owns the domain. Reverse means finding a domain from an IP. Zone transfers copy databases."},
  368: {correct:"Single-mode optical fiber has a core diameter so narrow (approx 8-10 microns) that light can only travel in a single straight ray (mode). This completely eliminates 'modal dispersion', allowing for vastly longer distances and higher bandwidth than multi-mode fiber.", wrong:"Multi-mode is thicker and suffers from light bouncing (dispersion). Copper uses electrons. Coaxial uses radio frequencies."},
  369: {correct:"In wireless networks, the 'Hidden Terminal Problem' occurs when Node A and Node C can both transmit to Node B, but cannot hear each other, causing collisions. It is mitigated using RTS/CTS (Request to Send / Clear to Send) control frames.", wrong:"The Exposed Terminal problem prevents transmission unnecessarily. CSMA/CD is for wired networks. Multipath fading is physical interference."},
  370: {correct:"Route Aggregation (or Supernetting) combines multiple smaller subnets into a single larger route advertisement. This drastically reduces the size of routing tables in core internet routers.", wrong:"Subnetting divides networks. NAT translates IPs. PAT (Port Address Translation) uses ports for NAT."},
  371: {correct:"In Software Defined Networking (SDN), the fundamental paradigm shift is the decoupling of the Control Plane (the 'brain' making routing decisions) from the Data Plane (the hardware actually forwarding the packets).", wrong:"SDN does not merge them. It relies heavily on centralized controllers (like OpenFlow) communicating with dumb switches."},

  // Cryptography
  372: {correct:"OAEP (Optimal Asymmetric Encryption Padding) is a padding scheme specifically designed for RSA. It uses a Feistel network structure with hash functions to introduce randomness, making RSA semantically secure against chosen-ciphertext attacks.", wrong:"PKCS#5/7 is for block ciphers like AES. HMAC is for message authentication. Diffie-Hellman does not use padding."},
  373: {correct:"Elliptic Curve Cryptography (ECC) provides the same level of security as RSA but requires significantly smaller key sizes. A 256-bit ECC key offers comparable security to a massive 3072-bit RSA key.", wrong:"RSA requires much larger keys for equal security. AES is symmetric. ECC is mathematically based on algebraic curves, not faster factoring."},
  374: {correct:"A Length Extension Attack targets hash functions constructed using the Merkle-Damgård construction (like MD5, SHA-1, and SHA-2). An attacker can append extra data to a hash without knowing the original secret key/data.", wrong:"SHA-3 uses a Keccak sponge construction, making it immune to length extension attacks. Birthday attacks target collisions."},
  375: {correct:"Ephemeral Diffie-Hellman (DHE) generates unique, temporary key pairs for every single session. This guarantees Perfect Forward Secrecy; if the server's long-term private key is stolen later, past sessions cannot be decrypted.", wrong:"Standard RSA key exchange lacks forward secrecy. Static DH uses fixed keys. MACs only provide integrity."},
  376: {correct:"Certificate Transparency (CT) is an open framework consisting of cryptographically verifiable, append-only public logs of all issued SSL/TLS certificates. It prevents CAs from secretly issuing malicious certificates for a domain.", wrong:"OCSP checks revocation status. CSRs generate requests. PKCS#12 is a file format for storing keys/certs."},
  377: {correct:"A zk-SNARK is a form of Zero-Knowledge Proof. The acronym stands for Zero-Knowledge Succinct Non-Interactive Argument of Knowledge. It allows a prover to verify they computed a function without any back-and-forth interaction with the verifier.", wrong:"Interactive proofs require back-and-forth. Homomorphic encryption allows computation on ciphertexts. MACs verify data origin."},
  378: {correct:"Shor's Algorithm is a quantum computer algorithm that can efficiently solve Integer Factorization and Discrete Logarithms in polynomial time. If a sufficiently powerful quantum computer is built, Shor's Algorithm will completely break RSA and Diffie-Hellman.", wrong:"Grover's algorithm searches unstructured databases. AES is largely resistant to quantum attacks (requiring only longer keys via Grover's bounds)."},
  379: {correct:"Argon2, bcrypt, and PBKDF2 are Key Derivation Functions (KDFs). They are intentionally designed to be slow and computationally expensive (adding 'work factors' or memory hardness) to thwart brute-force and dictionary attacks on passwords.", wrong:"They are not symmetric ciphers, hash algorithms for file integrity, or digital signatures. They specifically hash passwords securely."},
  380: {correct:"In Shamir's Secret Sharing (a threshold scheme based on polynomial interpolation), a secret is divided into 'n' pieces. The secret can be perfectly reconstructed if and only if 't' (the threshold) or more pieces are combined. With fewer than 't' pieces, absolutely zero information about the secret is revealed.", wrong:"It doesn't rely on hashing, elliptic curves, or bitwise XORing. It mathematically relies on the fact that it takes 'k' points to define a polynomial of degree 'k-1'."},
  381: {correct:"OCSP Stapling (Online Certificate Status Protocol Stapling) shifts the burden of checking certificate revocation. Instead of the client querying the CA, the web server periodically queries the CA and 'staples' the signed time-stamped response directly into the TLS handshake.", wrong:"CRLs force the client to download a massive list. Certificate pinning hardcodes the expected certificate. DNSSEC protects DNS records."},
// === Batch 7 Explanations (382 - 431) ===
  // Data Structures
  382: {correct:"A Radix Tree (or Patricia Trie) is a space-optimized Trie. In a Radix tree, any node that is the only child of its parent is merged with the parent, significantly reducing memory overhead for sparse datasets.", wrong:"A B+ Tree is for databases. A Suffix Tree is for substrings. A standard Trie does not merge nodes."},
  383: {correct:"In a B+ Tree, internal nodes exclusively store search keys for routing, while actual data pointers are strictly stored at the leaf level. This allows the internal nodes to hold more keys, making the tree shallower and faster.", wrong:"B-Trees store data pointers in internal nodes. B* Trees have a different splitting logic. AVL Trees are binary."},
  384: {correct:"A Fibonacci Heap is mathematically optimized for graph algorithms like Dijkstra's because its 'Decrease-Key' operation takes an incredible O(1) amortized time, compared to O(log n) in a standard Binary Heap.", wrong:"O(log n) is for Binary Heaps. O(n) is for unsorted arrays. O(1) worst-case is not guaranteed, it is amortized."},
  385: {correct:"Building a Segment Tree from an array of 'n' elements takes strictly O(n) time because it has 2n-1 nodes, and each node is computed in O(1) time from its two children.", wrong:"O(n log n) is for sorting. O(log n) is for querying/updating the segment tree. O(n²) is too slow."},
  386: {correct:"For Double Hashing to successfully probe every single slot in a hash table before repeating a sequence, the secondary hash value (Hash2(k)) MUST be relatively prime to the table size (m).", wrong:"It doesn't need to be prime itself, just relatively prime to 'm'. Using linear probing leads to clustering. Table size must be fixed."},
  387: {correct:"The Bellman-Ford algorithm can handle graphs with negative edge weights and is specifically capable of detecting negative-weight cycles (which cause shortest-path algorithms to loop infinitely).", wrong:"Dijkstra's fails on negative weights. Prim's and Kruskal's are for Minimum Spanning Trees, not shortest paths."},
  388: {correct:"In the A* (A-Star) search algorithm, a heuristic is 'admissible' if it NEVER overestimates the actual cost to reach the goal. If it is admissible, A* is mathematically guaranteed to find the optimal shortest path.", wrong:"Overestimating can cause A* to miss the optimal path. It does not require negative weights or depth-first behavior."},
  389: {correct:"An efficient LRU (Least Recently Used) Cache is implemented using a Hash Map (for O(1) key lookups) combined with a Doubly Linked List (to achieve O(1) time for moving recently accessed items to the front and evicting the LRU item at the tail).", wrong:"A Queue alone takes O(n) to find an item. A BST takes O(log n). A Stack lacks middle-removal efficiency."},
  390: {correct:"A Bloom Filter is a highly space-efficient probabilistic data structure. It can definitively tell you if an element is NOT in the set (no false negatives), but it may incorrectly claim an element IS in the set (false positives) due to hash collisions.", wrong:"It never yields false negatives. It is not an exact structure. It does not store actual values, just bits."},

  // Operating System
  391: {correct:"An Orphan Process is created when a parent process terminates before its child process. The OS (specifically the 'init' process in Unix) 'adopts' the orphan and eventually reaps its exit status.", wrong:"A Zombie is a finished child waiting for its parent to read its status. A Daemon is a background service. A Thread is part of a process."},
  392: {correct:"When handling a Page Fault, the exact sequence is: 1. Trap to OS, 2. Save registers/state, 3. Determine if the reference was legal (if so, find free frame), 4. Read page from disk, 5. Update page table, 6. Restart the interrupted instruction.", wrong:"You must read the disk BEFORE updating the page table. You must restart the instruction, not skip it."},
  393: {correct:"A Mutex (Mutual Exclusion) incorporates strict thread ownership; only the thread that successfully locked the Mutex is authorized to unlock it. A Binary Semaphore has no ownership and can be signaled by any thread.", wrong:"Both take 0 and 1. Both prevent race conditions. Semaphores are not strictly hardware-based."},
  394: {correct:"The Completely Fair Scheduler (CFS) uses a Red-Black Tree to track task virtual runtimes. Inserting a new task into a Red-Black Tree takes exactly O(log N) time, where N is the number of active tasks.", wrong:"O(1) was the time for the older Linux 2.6 scheduler. O(N) is too slow for a modern OS scheduler."},
  395: {correct:"Thrashing is defined as a severe state where a system spends more CPU time endlessly swapping pages in and out of the disk than it does executing actual application instructions.", wrong:"It is not related to CPU overheating, deadlock loops, or interrupt storms."},
  396: {correct:"RAID 10 (1+0) is a 'stripe of mirrors' and provides excellent fault tolerance and speed. It can survive multiple disk failures as long as no two failed disks belong to the same mirrored pair.", wrong:"RAID 0 has no fault tolerance. RAID 5 survives only 1 failure. RAID 1 is just a single mirror pair."},
  397: {correct:"Virtual Memory mathematically decouples logical memory from physical memory. Its primary capability is allowing an OS to execute a program whose total size is larger than the available physical RAM.", wrong:"It does not speed up the CPU directly. It relies on the disk, making memory access slightly slower due to page faults."},
  398: {correct:"A user program transitions into Kernel Mode exclusively by executing a specific machine instruction that triggers a Software Interrupt (often called a Trap or System Call).", wrong:"It cannot flip a bit manually. Polling is for I/O. DMA is for hardware data transfer."},
  399: {correct:"In Dijkstra's Banker's Algorithm, the matrix 'Need' is calculated mathematically as: Need[i][j] = Max[i][j] - Allocation[i][j]. It represents the remaining resources a process might request.", wrong:"Available refers to unallocated resources. The formula requires subtracting Allocation from Max."},
  400: {correct:"Unix 'inodes' manage massive files by using tiered pointers: Direct Pointers, a Single Indirect Pointer (pointing to a block of pointers), a Double Indirect Pointer, and a Triple Indirect Pointer for extremely large files.", wrong:"Contiguous allocation, FAT tables, and linked lists are used by other filesystems (like MS-DOS), not standard Unix."},

  // Database Management System
  401: {correct:"The Write-Ahead Logging (WAL) protocol strictly mandates that the log record detailing a modification MUST be written to stable storage (disk) BEFORE the actual modified data page is written to disk.", wrong:"Writing data before the log destroys crash recovery. It has nothing to do with table locks or read isolation."},
  402: {correct:"The 'Serializable' isolation level is the strictest transaction level. It uses range locks or table-level locks to completely prevent Phantom Reads (where a concurrent transaction inserts new rows matching a WHERE clause).", wrong:"Read Committed allows Phantoms. Repeatable Read prevents non-repeatable reads but explicitly permits Phantoms."},
  403: {correct:"A relation is in Boyce-Codd Normal Form (BCNF) if and only if every determinant is a candidate key. This makes it slightly stricter than 3NF, which allows determinants to be non-keys if the dependent is a prime attribute.", wrong:"4NF deals with multi-valued dependencies. 2NF deals with partial dependencies."},
  404: {correct:"A Left Outer Join preserves ALL records from the 'left' table, regardless of whether there is a match in the 'right' table. Unmatched rows will contain NULLs for the right table's columns.", wrong:"Inner join drops unmatched rows. Right outer join keeps right table rows. Cross join pairs every row."},
  405: {correct:"Atomicity (the 'All-or-Nothing' property) is implemented by the DBMS using an Undo Log. If a transaction fails or is rolled back, the DBMS reads the Undo Log backwards to reverse all partial changes.", wrong:"Redo logs provide Durability. 2PL provides Isolation. Integrity constraints provide Consistency."},
  406: {correct:"The 'Fanout' or 'Branching Factor' of a B+ Tree refers to the maximum number of children (pointers) an internal node can hold. A higher fanout creates a wider, shallower tree, drastically reducing disk I/O.", wrong:"It does not refer to tree height, leaf data size, or the hash collision rate."},
  407: {correct:"When defining a Foreign Key, the 'ON DELETE CASCADE' constraint instructs the database to automatically delete any child rows referencing a parent row the moment the parent row is deleted.", wrong:"RESTRICT blocks the deletion. SET NULL leaves the child row but nullifies the reference."},
  408: {correct:"View Serializability is less strict than Conflict Serializability because it permits 'Blind Writes' (writing to a variable without reading it first). A schedule can be View Serializable but not Conflict Serializable.", wrong:"Conflict is stricter than View. Neither allows dirty reads. Blind writes are the specific differentiating factor."},
  409: {correct:"In Relational Algebra, a Cartesian Product (Cross Product) combines two relations. If Relation A has 'm' rows and Relation B has 'n' rows, the resulting relation will have exactly 'm * n' rows.", wrong:"m + n is a Union. min(m,n) is an Intersection. The Cartesian product pairs every row with every other row."},
  410: {correct:"Multi-Version Concurrency Control (MVCC) achieves high performance because 'Readers do not block Writers, and Writers do not block Readers.' It provides readers with a historical snapshot of the data.", wrong:"Writers still block Writers (to prevent lost updates). It does not eliminate the transaction log."},

  // Computer Networks
  411: {correct:"In a TCP SYN Flood attack, the attacker sends thousands of SYN requests but never completes the 3-way handshake with an ACK. This leaves the server with thousands of 'half-open' connections, exhausting its memory resources.", wrong:"It does not encrypt the payload, guess passwords, or flood ICMP pings (that's a Ping of Death)."},
  412: {correct:"A CIDR /22 mask means 22 bits are used for the network, leaving 10 bits for host addresses (32 - 22 = 10). 2^10 = 1024 total IPs. Subtracting network and broadcast addresses leaves exactly 1022 usable hosts.", wrong:"1024 is the total block, not usable hosts. 254 is for a /24. 510 is for a /23."},
  413: {correct:"In OSPF (Open Shortest Path First), a router elects its Router ID based on: 1) The manually configured ID, 2) The highest IP address on an active Loopback interface, 3) The highest IP on an active physical interface.", wrong:"MAC addresses are used for STP root bridge elections, not OSPF. Lowest IP is incorrect."},
  414: {correct:"The Spanning Tree Protocol (STP) operates at Layer 2 (Data Link). Its sole purpose is to mathematically disable redundant switch links to prevent endless broadcast storms and switching loops.", wrong:"It does not encrypt traffic, assign IP addresses (DHCP), or route packets (Routers do that)."},
  415: {correct:"BGP (Border Gateway Protocol) is classified as a Path-Vector protocol. Instead of just distance, it tracks the exact sequence of Autonomous Systems (AS-Path) a route traverses to explicitly prevent routing loops.", wrong:"OSPF is Link-State. RIP is Distance-Vector. EIGRP is Advanced Distance-Vector."},
  416: {correct:"The DHCP lease process follows the D.O.R.A sequence: 1. Discover (Client broadcasts), 2. Offer (Server offers IP), 3. Request (Client formally requests it), 4. Acknowledge (Server confirms lease).", wrong:"Detect/Observe are incorrect. The sequence is strictly Discover -> Offer -> Request -> Acknowledge."},
  417: {correct:"An IPv6 address is 128 bits long and is represented in hexadecimal format, divided into 8 groups of 4 hexadecimal digits separated by colons (e.g., 2001:0db8:85a3:0000:0000:8a2e:0370:7334).", wrong:"IPv4 is 32 bits / decimal. MAC addresses are 48 bits / hex. IPv6 is never 256 bits."},
  418: {correct:"Port Address Translation (PAT), also known as NAT Overload, maps multiple private IP addresses to a SINGLE public IP address by assigning unique logical source port numbers to each session.", wrong:"Static NAT maps 1-to-1. Dynamic NAT maps to a pool of IPs. PAT relies strictly on layer 4 ports to multiplex traffic."},
  419: {correct:"Wired Ethernet uses CSMA/CD (Collision Detection) because voltage spikes on a wire indicate a collision. Wireless Wi-Fi uses CSMA/CA (Collision Avoidance) because radios cannot simultaneously transmit and listen to detect collisions.", wrong:"Fiber optics do not use CSMA. Token ring uses tokens. The detection vs avoidance distinction is purely wired vs wireless."},
  420: {correct:"The Address Resolution Protocol (ARP) bridges Layer 3 and Layer 2. It broadcasts an IP address to find the corresponding physical hardware MAC address on a local area network.", wrong:"DNS translates domains to IPs. DHCP assigns IPs. NAT translates private to public networks."},

  // Cryptography
  421: {correct:"Standard Diffie-Hellman allows two parties to create a shared secret over a public channel, but it does NOT authenticate either party. Therefore, it is completely vulnerable to a Man-in-the-Middle (MITM) attack.", wrong:"It is mathematically secure against brute-force (Discrete Log problem). It is vulnerable specifically to active interception."},
  422: {correct:"The Advanced Encryption Standard (AES) processes data in fixed block sizes of exactly 128 bits. The key sizes can vary (128, 192, 256 bits), but the data block size remains 128 bits.", wrong:"DES uses 64-bit blocks. SHA-256 is a hash, not a block cipher. 256 bits refers to AES keys, not blocks."},
  423: {correct:"A cryptographic 'Collision' occurs strictly when two completely different, unique inputs fed into a hash function mathematically result in the exact same output hash digest.", wrong:"Using the same input naturally yields the same output. Reversing a hash is a pre-image attack. Guessing the key is brute force."},
  424: {correct:"X.509 is the internationally recognized ITU-T standard that strictly defines the format, fields, and structures of Public Key Certificates used in SSL/TLS and PKI systems.", wrong:"PKCS#7 is a padding/signature format. PGP is a decentralized 'web of trust'. AES is an encryption algorithm."},
  425: {correct:"The RSA algorithm derives its security entirely from the mathematical intractability of Integer Factorization—specifically, the extreme difficulty of finding the original two large prime numbers when given their product.", wrong:"Discrete Logarithms secure Diffie-Hellman. Elliptic curves secure ECC. Feistel networks are for symmetric ciphers."},
  426: {correct:"A 'Salt' is a random string of data uniquely generated and appended to a password before hashing. Its primary purpose is to defeat pre-computed dictionary and Rainbow Table attacks.", wrong:"Salting does not encrypt the hash, make it reversible, or guarantee complexity. It just randomizes the hash output."},
  427: {correct:"Elliptic Curve Cryptography (ECC) is highly prized because it provides the same level of cryptographic security as RSA while using significantly smaller key sizes, saving massive bandwidth and battery life in mobile/IoT devices.", wrong:"It is not immune to quantum computers (Shor's algorithm breaks ECC too). It is asymmetric, not symmetric."},
  428: {correct:"The fundamental problem with Symmetric Key Cryptography is the 'Key Distribution Problem'—both parties must securely exchange the single shared key before they can communicate securely over an insecure channel.", wrong:"Symmetric crypto is very fast and uses small keys. Asymmetric crypto solves the distribution problem but is much slower."},
  429: {correct:"Steganography is the science of concealing the very existence of a message (e.g., hiding data in image pixels). Cryptography does not hide the message's existence; it simply renders its contents unreadable to unauthorized parties.", wrong:"Cryptography is for confidentiality. Steganography is for plausible deniability and absolute secrecy of the communication itself."},
  430: {correct:"Non-repudiation (ensuring a sender cannot deny sending a message) is mathematically achieved using Digital Signatures. The sender hashes the message and encrypts the hash with their OWN Private Key, allowing anyone to verify it with their Public Key.", wrong:"Symmetric keys cannot provide non-repudiation because both parties share the key. Encrypting with a public key provides confidentiality, not a signature."},
// === Batch 8 Explanations (432 - 481) ===
  // Data Structures
  431: {correct:"Searching in a Trie depends strictly on the length of the word being searched, denoted as 'L'. It takes O(L) time, making it exceptionally fast for string matching regardless of how many millions of words are in the dictionary.", wrong:"O(log n) is for BSTs. O(1) is for Hash Maps. O(n) would imply searching the entire dataset linearly."},
  432: {correct:"By using both 'Path Compression' and 'Union by Rank', the Disjoint-Set (Union-Find) structure reduces the time complexity of operations to the Inverse Ackermann function, α(n), which grows so slowly it is effectively O(1) for any practical input size.", wrong:"O(log n) is achieved with just Union by Rank. O(1) strictly is mathematically incorrect, though practically similar. O(n) is the worst-case without optimizations."},
  433: {correct:"When inserting a new node into a Red-Black Tree, restoring the tree's balancing properties requires recoloring and at most two rotations (unlike an AVL tree, which might require O(log n) rotations for deletions, though only 2 for insertions).", wrong:"AVL and Red-Black trees require at most 2 rotations for an INSERT, ensuring the operation remains strictly bounded."},
  434: {correct:"In a B-Tree of order 'm', the root can have as few as 1 key. However, every other internal node MUST contain at least ceil(m/2) - 1 keys to remain half-full and bushy.", wrong:"m-1 is the maximum number of keys. m/2 is the minimum number of pointers (children), not keys."},
  435: {correct:"A sorting algorithm is 'Stable' if it preserves the relative original order of equal elements. Heap Sort is inherently unstable because the heapify process continuously swaps elements across the tree, scrambling their original relative order.", wrong:"Merge Sort and Insertion Sort are natively stable. Bubble Sort is stable."},
  436: {correct:"The Floyd-Warshall algorithm uses Dynamic Programming to compute the shortest paths between ALL pairs of vertices. It systematically builds the shortest paths by checking if intermediate vertices improve the path cost.", wrong:"Dijkstra's is a Greedy algorithm. Bellman-Ford is DP but only for Single-Source. Kruskal's uses a Disjoint Set."},
  437: {correct:"A Topological Sort of a Directed Acyclic Graph (DAG) is essentially a reverse Post-Order traversal. It is universally implemented using Depth-First Search (DFS), pushing nodes to a stack only after fully exploring their descendants.", wrong:"BFS is used for shortest paths in unweighted graphs (Kahn's algorithm uses BFS for topological sort using in-degrees, but DFS is the standard recursive method)."},
  438: {correct:"In an array-based Circular Queue of size N, the queue is full when the next position of the 'rear' pointer wraps around and hits the 'front' pointer. The formula is: (rear + 1) % N == front.", wrong:"front == rear means the queue is completely empty. rear == N - 1 only applies to linear queues."},
  439: {correct:"When a dynamic array (like a C++ vector or Java ArrayList) fills up, it allocates a new array of double the size and copies elements. While this specific resize takes O(n) time, the Amortized time complexity over many insertions remains strictly O(1).", wrong:"O(n) is the worst-case, but amortized means the average cost per operation over a sequence, which is O(1)."},
  440: {correct:"To balance an AVL tree, four types of rotations are used depending on the insertion configuration: Left-Left (LL), Right-Right (RR), Left-Right (LR), and Right-Left (RL).", wrong:"Up-Down and Forward-Backward are made-up terms. Splaying is for Splay Trees."},

  // Operating System
  441: {correct:"The Priority Inheritance Protocol dictates that if a low-priority task holds a resource that a high-priority task needs, the low-priority task temporarily 'inherits' the high priority so it can finish quickly and release the resource, solving Priority Inversion.", wrong:"Priority Ceiling is a different protocol. Aging prevents starvation. Context switching is the OS mechanism for changing processes."},
  442: {correct:"Effective Access Time (EAT) for a TLB is calculated as: (Hit Ratio * Time to access TLB/Memory) + (Miss Ratio * Time to access Memory twice). It mathematically represents the average memory access delay.", wrong:"It accounts for both hits and misses. A TLB miss requires two RAM accesses: one for the page table, one for the actual data."},
  443: {correct:"A Translation Lookaside Buffer (TLB) is implemented in hardware using Associative Memory (Content-Addressable Memory or CAM). This allows the hardware to search all TLB entries simultaneously in parallel for a lightning-fast O(1) lookup.", wrong:"Standard RAM, Magnetic Disks, and EEPROM are sequentially or block-addressed and are too slow for MMU translations."},
  444: {correct:"Peterson's Solution is a classic software-based algorithm for mutual exclusion. To be valid, any critical section protocol MUST satisfy three strict requirements: Mutual Exclusion, Progress, and Bounded Waiting.", wrong:"Deadlock freedom is a byproduct, but Progress and Bounded Waiting are the formal definitions. Context switching is an OS feature, not a requirement."},
  445: {correct:"Because a Microkernel strips non-essential services out of the kernel space and runs them in user space, applications must communicate with these services using Message Passing (Inter-Process Communication / IPC).", wrong:"Shared Memory is faster but harder to secure in microkernels. Direct Memory Access (DMA) is for hardware I/O."},
  446: {correct:"The Linux 'Slab Allocator' is a memory management mechanism specifically optimized for caching and allocating kernel objects (like task structs and inodes) of the same size, drastically reducing internal fragmentation.", wrong:"The Buddy System manages physical pages. Paging manages user memory. The Slab Allocator sits on top of the Buddy System for fine-grained kernel objects."},
  447: {correct:"Cycle Stealing is a technique used by the Direct Memory Access (DMA) controller. It steals occasional memory cycles from the CPU to transfer data to RAM, delaying the CPU slightly but saving it from handling massive I/O transfers.", wrong:"Thrashing is excessive paging. Spooling is buffering output to disk. Interrupt handling completely stops the CPU."},
  448: {correct:"A Soft Real-Time system (like streaming video) aims to meet deadlines but can tolerate occasional misses with degraded quality. A Hard Real-Time system (like a pacemaker or missile guidance) considers a missed deadline a catastrophic total system failure.", wrong:"The difference is NOT hardware speed, preemptive vs non-preemptive, or batch processing."},
  449: {correct:"A Thread Control Block (TCB) contains information unique to a single thread: its specific CPU registers, Program Counter, and Stack Pointer. The memory heap and open files are shared process-wide and reside in the PCB.", wrong:"Open files, memory limits, and the BSS segment belong to the Process (PCB), not the individual Thread (TCB)."},
  450: {correct:"In Disk Scheduling, the LOOK algorithm is a smarter version of SCAN (the elevator algorithm). Instead of going all the way to the physical edge of the disk, LOOK reverses direction immediately after servicing the last request in the current direction.", wrong:"C-SCAN always goes to the edge. SSTF goes to the closest request. FCFS is purely chronological."},

  // Database Management System
  451: {correct:"Strict Two-Phase Locking (Strict 2PL) requires that a transaction hold all of its exclusive (write) locks until it fully COMMITS or ABORTS. This strictly prevents other transactions from reading uncommitted data, thereby avoiding Cascading Rollbacks.", wrong:"Basic 2PL releases locks early, which can cause cascading rollbacks. Wait-Die is a deadlock prevention scheme."},
  452: {correct:"Relational Algebra is a Procedural language (it dictates exactly HOW to evaluate a query step-by-step). Relational Calculus is a Declarative (non-procedural) language (it describes WHAT data to retrieve, not how).", wrong:"SQL is based on both, but Algebra is strictly procedural step-by-step logic."},
  453: {correct:"A major drawback of Boyce-Codd Normal Form (BCNF) is that, unlike 3NF, decomposing a relation into BCNF may result in the loss of Dependency Preservation (some functional dependencies cannot be checked in a single table anymore).", wrong:"3NF guarantees dependency preservation. BCNF guarantees zero functional dependency anomalies but sacrifices preservation."},
  454: {correct:"In a Sparse Index, index records are only created for some of the data records (typically one per disk block). In a Dense Index, an index entry exists for every single search-key value in the database.", wrong:"Clustered indexes dictate physical sorting. B-Trees are structural layouts. Sparse indexes require the data file to be sequentially sorted."},
  455: {correct:"The Redo Log is the primary mechanism a DBMS uses to guarantee Durability. If the system crashes after a transaction commits but before the data pages are flushed to disk, the Redo Log is replayed to permanently write the changes.", wrong:"The Undo Log guarantees Atomicity (rollbacks). 2PL guarantees Isolation. Constraints guarantee Consistency."},
  456: {correct:"A Database Trigger is a special type of stored procedure that automatically executes (fires) implicitly in response to specific DML events (INSERT, UPDATE, DELETE) executed on a specific table.", wrong:"An Assertion is a global boolean rule. A View is a virtual table. An Index speeds up queries."},
  457: {correct:"In a SQL query, the WHERE clause filters individual rows BEFORE they are grouped. The HAVING clause acts exactly like WHERE, but it filters aggregated groups AFTER the GROUP BY clause has been applied.", wrong:"ORDER BY sorts data. JOIN combines tables. WHERE cannot filter aggregate outputs like COUNT() or SUM()."},
  458: {correct:"The CAP Theorem dictates that a distributed database can only guarantee two out of three: Consistency (all nodes see the same data), Availability (every request receives a response), and Partition Tolerance (the system operates despite network drops).", wrong:"Concurrency, Atomicity, and Persistence are different concepts (ACID)."},
  459: {correct:"During a Hash Join, the algorithm first executes a 'Build' phase (creating an in-memory hash table of the smaller relation), followed by a 'Probe' phase (scanning the larger relation and hashing its keys to find matches in the table).", wrong:"Sort and Merge are phases of a Sort-Merge Join. Nested loops do not use hashing. Partitioning is for parallel queries."},
  460: {correct:"Apache Cassandra and HBase are classified as Wide-Column (or Column-Family) NoSQL stores. They store data in dynamic columns rather than rigid rows, optimizing for massive read/write speeds over distributed nodes.", wrong:"MongoDB is also wide-column. Redis is a Document store (JSON). Neo4j is a Graph database. Redis is Key-Value."},

  // Computer Networks
  461: {correct:"In TCP, the Sliding Window protocol is exclusively responsible for End-to-End Flow Control. It allows the receiver to dynamically advertise how much buffer space it has available, preventing the sender from overwhelming it.", wrong:"Congestion control prevents overwhelming the intermediate network (routers), not the receiver. Error control uses checksums."},
  462: {correct:"In the IPv4 protocol suite, the UDP Checksum field is technically optional (can be set to all zeros if unused). However, in IPv6, the UDP checksum is strictly mandatory to ensure data integrity.", wrong:"TCP checksums are always mandatory. ICMP is for pinging. MAC addresses have a Frame Check Sequence (FCS)."},
  463: {correct:"The 'Traceroute' diagnostic tool exploits the IP 'Time To Live' (TTL) field. It intentionally sends packets with TTL=1, then TTL=2, etc., forcing successive routers to drop the packet and return an ICMP 'Time Exceeded' message, mapping the path.", wrong:"Ping uses ICMP Echo Request/Reply. ARP finds MAC addresses. DHCP requests IPs."},
  464: {correct:"OSPF (Open Shortest Path First) is an Interior Gateway Protocol that builds a Link-State database. It uses Dijkstra's Shortest Path First (SPF) mathematical algorithm to compute the best routes to all subnets.", wrong:"Bellman-Ford is used by Distance-Vector protocols like RIP. DUAL is used by EIGRP. BGP uses Path-Vector."},
  465: {correct:"In BGP routing, an Autonomous System Number (ASN) uniquely identifies a distinct network administration domain on the Internet (like an ISP or large enterprise). BGP uses AS-Paths to prevent routing loops.", wrong:"VLAN tags identify local networks. MAC addresses identify hardware. Subnet masks identify network bounds."},
  466: {correct:"In IPsec, 'Transport Mode' only encrypts the data payload (leaving the original IP header intact, mostly used for host-to-host). 'Tunnel Mode' encrypts the entire original packet and adds a completely new IP header (used for VPN gateways).", wrong:"ESP provides encryption; AH provides authentication. Neither dictate the tunnel vs transport architecture directly."},
  467: {correct:"The IEEE 802.1Q standard implements VLANs by inserting exactly 4 bytes (32 bits) of tag information into the Ethernet frame header (which includes the 12-bit VLAN ID).", wrong:"8 bytes is for PPPoE. 20 bytes is an IP header. 48 bits is a MAC address length."},
  468: {correct:"The 'Hidden Terminal Problem' in 802.11 Wi-Fi causes massive collisions because two nodes can both reach the Access Point, but cannot hear each other. The solution is the exchange of RTS/CTS (Request to Send / Clear to Send) control frames.", wrong:"CSMA/CD is for wired networks. DSSS is a modulation technique. WPA2 is for encryption."},
  469: {correct:"At the Transport Layer (Layer 4), 'Multiplexing' is the process of taking data from multiple different application processes and encapsulating them with distinct Source Port Numbers into a single network stream.", wrong:"IP addresses are for Network Layer routing. MAC addresses are for Data Link local delivery. Encryption is Presentation Layer."},
  470: {correct:"A CIDR subnet mask of /28 utilizes 28 bits for the network and 4 bits for hosts. 2^4 = 16 total IPs. Subtracting the network and broadcast addresses leaves exactly 14 usable host IPs.", wrong:"30 hosts is a /27. 62 hosts is a /26. 254 hosts is a /24."},

  // Cryptography
  471: {correct:"A Stream Cipher (like RC4 or ChaCha20) encrypts plaintext one byte or one bit at a time by XORing it with a continuous, pseudo-random 'Keystream' generated from a symmetric key.", wrong:"Block ciphers (AES, DES) process fixed 128-bit or 64-bit blocks at once. RSA is asymmetric. Hashes do not encrypt."},
  472: {correct:"The 'Padding Oracle Attack' is a devastating cryptographic attack specifically targeting the CBC (Cipher Block Chaining) mode of operation. It exploits the server's error messages regarding invalid PKCS#7 padding to decrypt the ciphertext.", wrong:"GCM mode is immune to this. ECB is vulnerable to pattern analysis, not padding oracles. RSA is asymmetric."},
  473: {correct:"In cryptographic theory, 'Confusion' is achieved through Substitution (like S-boxes in AES), making the relationship between the key and ciphertext complex. 'Diffusion' is achieved through Transposition/Permutation, spreading a single plaintext bit's influence across many ciphertext bits.", wrong:"Hashing provides integrity. Obfuscation makes code unreadable. RSA relies on mathematical hardness."},
  474: {correct:"An HMAC (Hash-based Message Authentication Code) ensures both Data Integrity and Authenticity. It combines a cryptographic hash function (like SHA-256) with a secret Symmetric Key.", wrong:"A standard hash lacks the secret key, so it cannot prove authenticity (anyone can hash data). Digital signatures use Asymmetric keys."},
  475: {correct:"In a Public Key Infrastructure (PKI), the Root CA (Certificate Authority) is the ultimate anchor of trust. Because there is no higher authority to sign its certificate, a Root CA must be 'Self-Signed'.", wrong:"Subordinate CAs are signed by Root CAs. Web servers are signed by Subordinate CAs. Root CAs sign their own certificates."},
  476: {correct:"The 'Avalanche Effect' is a required property of strong cryptographic hashes and ciphers. It dictates that flipping just a single bit in the plaintext input must result in a drastic change (approximately 50%) of all output bits.", wrong:"The Birthday Paradox relates to collisions. Perfect Forward Secrecy secures past sessions. Asymmetric encryption uses two keys."},
  477: {correct:"A True Random Number Generator (TRNG) derives its randomness from unpredictable physical phenomena (like thermal noise, radioactive decay, or mouse movements) known as 'Entropy'. A PRNG relies purely on mathematical formulas and a seed.", wrong:"PRNGs are not truly random. Elliptic curves are for key exchange. Feistel networks are for ciphers."},
  478: {correct:"The Digital Signature Algorithm (DSA) relies fundamentally on the mathematical hardness of the Discrete Logarithm Problem, exactly like Diffie-Hellman and ElGamal.", wrong:"RSA relies on Integer Factorization. AES relies on Substitution-Permutation networks. Hash functions rely on compression algorithms."},
  479: {correct:"In IPsec, IKE (Internet Key Exchange) utilizes the Diffie-Hellman algorithm to securely negotiate and establish the symmetric session keys that ESP will then use to actually encrypt the bulk data.", wrong:"RSA is used for authentication, not the bulk key generation. AES is the cipher used after IKE finishes. MD5 is a hash."},
  480: {correct:"Cross-Certification is a PKI mechanism that establishes a trust relationship between two separate, independent Root Certificate Authorities. They essentially sign each other's certificates so clients trusting CA 1 will automatically trust CA 2.", wrong:"Certificate Revocation Lists invalidate keys. Key Escrow backs up private keys. A Web of Trust is PGP's decentralized model."},
// === Batch 9 Explanations (481 - 530) ===
  // Data Structures
  481: {correct:"A Suffix Array stores the lexicographically sorted starting indices of all suffixes of a string. It provides almost the exact same substring search capabilities as a Suffix Tree but requires significantly less memory overhead and has better cache locality.", wrong:"Suffix Trees use less memory. Suffix Arrays are faster to build natively in O(n). Suffix Arrays only search prefixes."},
  482: {correct:"The Rabin-Karp algorithm uses a Rolling Hash function (like the Rabin fingerprint) to efficiently filter out positions where the pattern cannot match, only performing a full character-by-character check when the hash values match.", wrong:"The KMP algorithm uses a Prefix/LPS array. Boyer-Moore uses bad-character heuristics. Z-Algorithm uses Z-arrays."},
  483: {correct:"The 0/1 Knapsack problem is optimally solved using Dynamic Programming (Tabulation or Memoization), building a 2D array based on the available items and the remaining weight capacity.", wrong:"Greedy approaches only work for the Fractional Knapsack problem. Dijkstra's is for shortest paths. Breadth-First Search is too slow (exponential)."},
  484: {correct:"QuickSelect uses the same partitioning logic as QuickSort. While its average time is O(n), if the pivot chosen is consistently the maximum or minimum element, the worst-case time complexity degrades to O(n²).", wrong:"O(n log n) is for QuickSort. O(log n) is for Binary Search. O(n) is the average case, not the worst case."},
  485: {correct:"According to Euler's theorem, an undirected connected graph contains an Eulerian Circuit (a path that visits every edge exactly once and returns to the start) if and only if every single vertex has an even degree.", wrong:"Having no cycles makes it a tree. Odd degrees indicate an Eulerian Path, not a circuit. Bipartite graphs relate to coloring, not Eulerian circuits."},
  486: {correct:"A Bipartite Graph can be colored using exactly two colors. Mathematically, a graph is bipartite if and only if it contains absolutely NO odd-length cycles.", wrong:"Bipartite graphs can have even-length cycles. They can be fully connected. They can contain isolated vertices."},
  487: {correct:"Heavy-Light Decomposition is an advanced tree technique that breaks a tree into a set of disjoint paths (heavy paths). This allows segment trees to be used to answer path queries (like finding the max edge between two nodes) in O(log² n) time.", wrong:"It is not used for bipartite matching, finding minimum spanning trees, or detecting negative cycles."},
  488: {correct:"In an AVL tree, the strict balancing factor ensures that the maximum height of a tree with 'n' nodes is strictly bounded by approximately 1.44 * log₂(n).", wrong:"O(n) is the height of an unbalanced BST. 2 * log₂(n) is the bound for a Red-Black Tree. log₂(n) exactly is only possible in a perfectly balanced tree."},
  489: {correct:"A Bloom Filter is a highly space-efficient probabilistic data structure used to test set membership. It guarantees no false negatives (if it says 'no', the item is definitely not there), but allows false positives (it might say 'yes' when the item isn't there).", wrong:"It does not guarantee no false positives. It cannot retrieve the actual elements stored. It is not used for strict cryptographic hashing."},
  490: {correct:"Johnson's Algorithm finds all-pairs shortest paths in sparse graphs with negative weights. It first uses the Bellman-Ford algorithm to compute a valid reweighting of all edges to be non-negative, then safely runs Dijkstra's algorithm from each vertex.", wrong:"It does not use Floyd-Warshall internally. It does not use Kruskal's. It relies strictly on Bellman-Ford for the initial reweighting phase."},

  // Operating System
  491: {correct:"An Inverted Page Table maintains exactly one entry for each physical frame of RAM, mapping it back to the virtual page. This drastically reduces the total memory consumed by page tables, especially in 64-bit systems.", wrong:"It does not speed up TLB lookups. It is not used to swap entire processes. It prevents internal fragmentation implicitly, but memory reduction is the primary goal."},
  492: {correct:"Shortest Job First (SJF), and its preemptive version Shortest Remaining Time First (SRTF), are mathematically proven to yield the optimal (minimum) average waiting time for a given set of processes.", wrong:"Round Robin minimizes response time, not waiting time. FCFS causes the convoy effect. Priority scheduling depends on arbitrary numbers."},
  493: {correct:"The Principle of Least Privilege dictates that a user, program, or process should only be granted the bare minimum access rights and permissions necessary to perform its legitimate function, minimizing potential security damage.", wrong:"It does not mean running in user mode permanently. It does not mean denying all network access. It is not related to CPU scheduling priorities."},
  494: {correct:"The Priority Ceiling Protocol elevates a task's priority to the highest priority of any task that MIGHT request that resource. This guarantees freedom from Deadlocks and chained blocking, which the simpler Priority Inheritance Protocol does not guarantee.", wrong:"Both solve Priority Inversion. Neither solves Thrashing or Fragmentation."},
  495: {correct:"In Linux's Completely Fair Scheduler (CFS), 'vruntime' tracks the amount of virtual time a process has executed on the CPU. The scheduler always picks the process with the lowest vruntime to run next, ensuring absolute fairness.", wrong:"It does not track time waiting in the queue. It is not a static integer priority. It does not measure disk I/O time."},
  496: {correct:"A Monitor is a high-level synchronization construct provided directly by the programming language (like Java). It handles mutual exclusion automatically, whereas a Semaphore is a low-level OS primitive that requires careful manual P() and V() implementation.", wrong:"Semaphores are not hardware only. Monitors can handle multiple threads. Monitors prevent deadlocks easier, but they don't natively 'prevent' all logic errors."},
  497: {correct:"RAID 6 extends RAID 5 by using block-level striping with TWO distributed parity blocks. This allows the array to continue functioning even if two discrete hard drives fail simultaneously.", wrong:"RAID 5 survives 1 failure. RAID 1 is mirroring. RAID 10 is a stripe of mirrors."},
  498: {correct:"The Linux Slab Allocator sits on top of the Buddy System. It pre-allocates caches of contiguous memory specifically for objects of the exact same size (like inodes), completely eliminating internal fragmentation for those kernel objects.", wrong:"It does not compress RAM. It does not handle virtual memory paging. It does not prevent thrashing."},
  499: {correct:"In an OS utilizing Demand Paging, a Page Fault explicitly occurs only when a running process attempts to access a valid memory page that is currently swapped out to the disk and not in physical RAM.", wrong:"It is not an illegal memory access (that's a Segmentation Fault). It is not caused by CPU overheating or division by zero."},
  500: {correct:"The Convoy Effect occurs primarily in First-Come, First-Served (FCFS) scheduling. It happens when multiple short, I/O-bound processes get stuck waiting for a long, CPU-bound process to finish, drastically reducing overall CPU and device utilization.", wrong:"Thrashing is disk-swapping. Priority Inversion involves mutexes. Starvation means never getting CPU time."},

  // Database Management System
  501: {correct:"ARIES (Algorithm for Recovery and Isolation Exploiting Semantics) relies heavily on Write-Ahead Logging (WAL) and the concept of 'Repeating History'—replaying all logged actions to recreate the exact crash state before undoing uncommitted transactions.", wrong:"Shadow Paging is a different recovery method. Two-Phase Locking is for concurrency, not crash recovery."},
  502: {correct:"Fourth Normal Form (4NF) specifically identifies and eliminates independent Multivalued Dependencies (MVDs), where one attribute uniquely determines multiple values of two completely independent attributes.", wrong:"3NF eliminates transitive dependencies. 2NF eliminates partial dependencies. BCNF eliminates all functional dependency anomalies."},
  503: {correct:"A Dense Index explicitly maintains an index entry for every single search-key value present in the actual data file. A Sparse Index only maintains entries for a subset of the search keys (usually one per block).", wrong:"Clustered indexes dictate physical order. Dense indexes are not necessarily primary keys. Hash indexes don't use B-trees."},
  504: {correct:"Thomas' Write Rule optimizes timestamp-based concurrency. If a transaction tries to write to a value, but a younger transaction has already written a newer value, Thomas' rule safely ignores the obsolete write instead of forcing a rollback.", wrong:"It does not ignore reads. It does not elevate read locks to write locks. It does not bypass 2PL (it is a timestamp protocol)."},
  505: {correct:"In distributed databases, the Two-Phase Commit (2PC) protocol guarantees Distributed Atomicity. It ensures that a transaction spanning multiple nodes either commits completely on ALL nodes or aborts on ALL nodes.", wrong:"It does not guarantee Partition Tolerance (it usually fails during partitions). It does not guarantee BCNF. It does not prevent dirty reads."},
  506: {correct:"A Materialized View differs from a standard virtual View because it physically computes and stores the query result set on the hard disk. This drastically speeds up complex read queries at the cost of requiring a maintenance/refresh strategy.", wrong:"Standard views do not store data. Indexed views are a specific SQL Server term. Temp tables delete automatically."},
  507: {correct:"A Dirty Write occurs when two uncommitted transactions try to overwrite the same data simultaneously. It is so destructive that it is strictly prevented by ALL standard isolation levels (including Read Uncommitted) by using exclusive write locks.", wrong:"Read Uncommitted allows Dirty Reads, but NEVER Dirty Writes. Serializable is the highest level, but all levels prevent dirty writes."},
  508: {correct:"The CAP Theorem dictates that in the presence of a network Partition (P), a distributed system must make a hard choice between guaranteeing Consistency (C) or guaranteeing Availability (A). It cannot guarantee both.", wrong:"Atomicity and Persistence are ACID properties. Confidentiality is a security property."},
  509: {correct:"During Relational Query Optimization, 'Pushing Selections Down' means applying WHERE filters as early as possible in the query tree. This minimizes the cardinality (row count) of the data before it hits expensive operations like JOINs.", wrong:"Pushing projections down reduces columns, but reducing rows via selection saves vastly more memory and CPU cycles."},
  510: {correct:"Multi-Version Concurrency Control (MVCC) creates discrete snapshots of data. This allows readers to read historical data without blocking writers, and writers to write without blocking readers, vastly improving throughput.", wrong:"Strict 2PL blocks readers. Timestamp ordering causes rollbacks. Deadlock detection allows blocking but kills cycles."},

  // Computer Networks
  511: {correct:"In the TCP header, the 'Window Size' field is explicitly used by the receiver to advertise how much buffer space it currently has available. This allows the sender to throttle its transmission rate, providing End-to-End Flow Control.", wrong:"Congestion Control is managed by the Congestion Window (cwnd), not the advertised window. Error checking uses the Checksum."},
  512: {correct:"The Spanning Tree Protocol (STP) operates at Layer 2. It communicates via BPDUs to logically block redundant switch ports, mathematically preventing broadcast storms and infinite switching loops.", wrong:"Routers prevent loops via the TTL field at Layer 3. STP does not encrypt data or assign IP addresses."},
  513: {correct:"In the Border Gateway Protocol (BGP), the AS-Path attribute explicitly records the sequence of Autonomous Systems a route has traversed. If a BGP router sees its own ASN in the path, it drops the route, preventing loops.", wrong:"Local Preference determines exit paths. MED determines entry paths. OSPF uses link-state databases, not AS-Paths."},
  514: {correct:"A CIDR /29 mask leaves 3 bits for hosts (32 - 29 = 3). 2^3 = 8 total IPs. Subtracting the network address and the broadcast address leaves exactly 6 usable host IP addresses.", wrong:"14 is for a /28. 30 is for a /27. 2 is for a /30."},
  515: {correct:"The Dynamic Host Configuration Protocol (DHCP) assigns IPs dynamically. It strictly uses the D.O.R.A sequence: Discover (client broadcast), Offer (server offers IP), Request (client requests it), Acknowledge (server confirms).", wrong:"DNS translates domains. ARP resolves MAC addresses. NAT translates private to public IPs."},
  516: {correct:"The IEEE 802.1Q standard enables Virtual LANs (VLANs) across trunk links by explicitly inserting a 4-byte (32-bit) VLAN tag into the standard Ethernet frame header.", wrong:"2 bytes is incorrect. 20 bytes is an IP header length. 8 bytes is a UDP header length."},
